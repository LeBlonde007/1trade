# 1Trade CI — lint, test, contract-check. See docs/plans/DEPLOYMENT.md §8.
# Fails closed; build/deploy stages are added as services land (M1+).
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene (secrets + pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (no secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: pre-commit
        # golangci-lint is a HARD gate in the `go` job below (pinned v2.12.2 + Go 1.25). Skip it here:
        # this job sets up only Python, so the hook would fall back to the runner's *bundled, unpinned*
        # golangci-lint — a version skew that fails nondeterministically against the pinned gate. The
        # remaining hooks (whitespace, secrets, yaml/json, ruff, eslint, the pygrep guards) still run.
        run: pipx install pre-commit && SKIP=golangci-lint pre-commit run --all-files --show-diff-on-failure

  contracts:
    name: contract check (OpenAPI + event schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Advisory: redocly's opinionated rules (security-defined, 4xx, 3.0 vs 3.1 nullable) flag the
      # shared specs, which only tech-lead may revise (contract-first rule). The hard gate is the
      # structural YAML parse below; this step surfaces spec-quality findings without failing the job.
      - name: lint OpenAPI specs (advisory)
        continue-on-error: true
        run: |
          if ls docs/contracts/openapi/*.yaml >/dev/null 2>&1; then
            npx --yes @redocly/cli@latest lint "docs/contracts/openapi/*.yaml"
          else
            echo "no OpenAPI specs yet"
          fi
      - name: validate event + k8s YAML parses
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          # k8s manifests are multi-document (--- separators), so parse the whole stream, not one doc.
          bad = 0
          for f in (glob.glob('docs/contracts/events/*.yaml')
                    + glob.glob('deploy/k8s/local/*.yaml')
                    + glob.glob('deploy/k8s/scheduling/*.yaml')):
              try: list(yaml.safe_load_all(open(f)))
              except Exception as e: print('INVALID', f, e); bad += 1
          print('YAML parse OK' if not bad else f'{bad} invalid file(s)')
          sys.exit(bad)
          PY

  go:
    name: go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }   # services declare `go 1.25.0`; 1.23 can't build them
      # Each services/* and apps/* is its own module, so a single `go ./...` from the repo root reaches
      # nothing — scripts/go-all.sh loops the modules (one source of truth with `make build`/`make test`).
      - name: build all modules
        run: bash scripts/go-all.sh build
      - name: race-test all modules
        run: bash scripts/go-all.sh test -race
      # golangci-lint v2 (Go-1.25 compatible), per-module via scripts/lint.sh — a HARD gate. The
      # golangci-lint-action runs at one working dir; our modules are separate, so we install + loop.
      - name: golangci-lint (all modules)
        if: hashFiles('**/*.go') != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/lint.sh
