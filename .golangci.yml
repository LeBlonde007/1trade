# Exascale — golangci-lint v2 config shared by every Go service + the CLI.
# Enforces the non-negotiables in docs/plans/ENGINEERING_STANDARDS.md:
#   - per-function doc comments (revive `exported` + godot)
#   - errors handled (errcheck) + Is/As + %w correctness (errorlint)
#   - security smells (gosec G-series), correctness (staticcheck, govet, bodyclose, sqlclosecheck, …)
# Run: golangci-lint run ./...   (v2.x — Go 1.25 compatible). Owner: infra-sre (CI) + tech-lead (rules).
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose       # http response bodies closed
    - contextcheck    # context propagated correctly
    - errcheck        # every returned error is handled
    - errorlint       # errors.Is/As + %w wrapping correctness
    - forbidigo       # ban specific patterns (see settings)
    - gocritic        # opinionated correctness/perf/style
    - godot           # comments end in a period (doc-comment discipline)
    - gosec           # security smells (G-series)
    - govet           # suspicious constructs
    - ineffassign     # ineffectual assignments
    - misspell        # typos in comments/strings
    - nilerr          # don't return nil on a non-nil error
    - noctx           # no http requests without context
    - prealloc        # preallocate slices where it matters
    - revive          # style + the exported-symbol doc-comment rule
    - rowserrcheck    # sql rows.Err() checked
    - sqlclosecheck   # sql rows/statements closed
    - staticcheck     # the big correctness linter
    - unused          # dead code
    # wrapcheck — DEFERRED. The codebase predates enforcement (broad unwrapped external errors); a
    # blanket enable is ~85 mechanical %w wraps. errcheck + errorlint already cover the correctness
    # core (handled + Is/As + %w). Re-enable after a dedicated wrapping sweep — tech-lead's call.

  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the structured logger, not fmt.Print* (the CLI is exempt — it prints to stdout)
        - pattern: ^panic\($
          msg: no panic in request paths; return an error (init-only panics are OK — nolint with reason)
    godot:
      scope: declarations
      capital: false
    gosec:
      excludes:
        - G104   # handled by errcheck (avoid double-reporting)
        - G101   # false positives on credit-type code constants + public URLs; real secrets via gitleaks + env/Secret
    revive:
      rules:
        - name: exported
          severity: error
          arguments: [checkPrivateReceivers, sayRepetitiveInsteadOfStutters]
        - name: package-comments
        - name: error-strings
        - name: error-return
        - name: context-as-argument
        - name: unhandled-error
          # Ignore errors that are infallible by contract, not real I/O:
          #  - fmt.*Print* — stdout/stderr (esp. the CLI, also exempt from forbidigo for this reason).
          #  - strings.Builder / bytes.Buffer writes — documented to never return a non-nil error.
          # Real io.Writer / file / net write errors are still flagged (handle hash writes with `_, _=`).
          arguments:
            - 'fmt\.Print'
            - 'fmt\.Printf'
            - 'fmt\.Println'
            - 'fmt\.Fprint'
            - 'fmt\.Fprintf'
            - 'fmt\.Fprintln'
            - 'strings\.Builder\.WriteString'
            - 'strings\.Builder\.WriteByte'
            - 'strings\.Builder\.WriteRune'
            - 'bytes\.Buffer\.Write'
            - 'bytes\.Buffer\.WriteString'
            - 'bytes\.Buffer\.WriteByte'
            - 'bytes\.Buffer\.WriteRune'

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests favour readability: fmt, looser handling, httptest.NewRequest (noctx), sentinel `==`
      # comparisons (errorlint), and recorder bodies (bodyclose) are fine in test code.
      - path: _test\.go
        linters: [forbidigo, gosec, errcheck, errorlint, noctx, bodyclose]
      # main.go: os.Exit-after-defer on unrecoverable startup is idiomatic (gocritic exitAfterDefer).
      - path: cmd/.*/main\.go
        linters: [forbidigo, gocritic]
      # The CLI legitimately writes results to stdout via fmt.Print* (forbidigo is a service rule).
      - path: cmd/exascale/.*\.go
        linters: [forbidigo]
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
