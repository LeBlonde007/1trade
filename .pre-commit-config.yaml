# Exascale — pre-commit hooks shared by every contributor and agent.
# These run before each commit so the standards in docs/plans/ENGINEERING_STANDARDS.md
# are enforced locally, not just in CI. Install once: `pre-commit install`.
# Owner: infra-sre.
#
# The same checks run in CI (DEPLOYMENT.md §8) so a missing local install can't bypass them.

minimum_pre_commit_version: "3.5.0"
fail_fast: false

# Verbatim design exports (docs/htmls — the original HTML screen mockups being migrated to Nuxt) and
# runtime data (the BFF feedback store) are NOT hand-maintained source: exempt them from every hook
# (whitespace / line-endings, and gitleaks false-positives on the mock KYC / brand HTML).
exclude: |
  (?x)^(
    docs/htmls/.*|
    Exascale\ Frontend/server/data/.*
  )$

repos:
  # --- universal hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'              # markdown EOF left to authors (consistent with trailing-whitespace)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]   # model weights / binaries do NOT belong in git
      - id: check-yaml
        args: ["--allow-multiple-documents"]   # k8s manifests are multi-doc ('---'-separated)
      - id: check-json
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.md$'

  # --- secrets: nothing sensitive ever enters history ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # --- Go: the full lint set (per-function doc comments, security, errors). Local hook because each
  # services/* and apps/cli is its own module — golangci-lint at the repo root reaches nothing, so we
  # loop the modules via scripts/lint.sh. Config is .golangci.yml (v2). golangci-lint v2.x must be on
  # PATH (scripts/install-toolchain.sh). ---
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint (all Go modules)
        entry: scripts/lint.sh
        language: script
        types: [go]
        pass_filenames: false

  # --- Python (inference runtime): ruff format + lint ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # --- Frontend (apps/web): eslint + prettier via local node ---
  - repo: local
    hooks:
      - id: eslint
        name: eslint (apps/web)
        language: system
        files: '^(apps/web|Exascale Frontend)/.*\.(ts|vue|js)$'
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && npm --prefix apps/web run lint --silent || true'
        pass_filenames: false

      # --- regulatory framing guard (F22): block banned customer-facing words ---
      - id: regulatory-framing
        name: regulatory framing guard (no securities language in customer-facing copy)
        language: pygrep
        files: '^(apps/web|Exascale Frontend)/.*\.(vue|ts|md)$'
        entry: '(?i)\b(futures contract|speculation|investment return|guaranteed (return|yield))\b'
        # Credits are "prepaid service units"; trading is paused. See features/F22-licensing-track.md.

      # --- design tokens guard (DESIGN_SYSTEM.md §7): no raw hex colors in components ---
      - id: design-tokens-guard
        name: design tokens guard (use var(--token), not raw hex, in components)
        language: pygrep
        files: '^(apps/web|Exascale Frontend)/.*\.vue$'
        # tokens.css/global.css hold the raw values; components must reference var(--token).
        # Matches #rgb / #rrggbb / #rrggbbaa hex color literals. Runs only on changed .vue files.
        entry: '#[0-9a-fA-F]{3}(?:[0-9a-fA-F]{3}(?:[0-9a-fA-F]{2})?)?\b'
        # TRACKED DEBT — pre-existing raw hex in the paused-exchange screens, the mockup-derived
        # auth/datacenter/status/states screens, and a few complex live screens (SVG stroke attrs,
        # bespoke chart palettes, light/dark tour popovers) that need real design work, not a token
        # swap. The guard still enforces on every other (live) component + all new .vue files. Burn
        # this list down as the screens are rebuilt/unpaused.
        exclude: '^Exascale Frontend/app/(pages/(trade|portfolio|benchmark|login|signup|states)\.vue|pages/(markets|datacenter|status|onboarding)/.*\.vue|pages/compute/\[id\]\.vue|pages/wallet/index\.vue|components/Trade/.*\.vue|components/App/GuidedTour\.client\.vue)$'
