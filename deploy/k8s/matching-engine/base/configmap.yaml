# matching-engine non-secret config. PLATFORM_JWT_SECRET comes from the shared `platform-auth`
# Secret (envFrom in the Deployment) — never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matching-engine-env
data:
  TRADE1_ENV: "dev"
  TRADING_ADDR: ":8087"
  # Published index methodology (commitment #2: the methodology is public and auditable).
  INDEX_METHODOLOGY_URL: "/benchmark"
  # Paper venue (KW03 cutover, paper only): the engine journal, the ledger it reserves and settles
  # against, and JetStream for trades.executed.v1 / orders.state.v1. Without DATABASE_URL the service
  # stays on the paused mock adapter. Real-money order entry is refused in code, not by config.
  DATABASE_URL: "postgres://1trade:1trade@postgres.data.svc.cluster.local:5432/1trade"
  CREDIT_LEDGER_URL: "http://credit-ledger:8002"
  NATS_URL: "nats://nats.data.svc.cluster.local:4222"
