apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  labels: { app: matching-engine }
spec:
  replicas: 1                       # local; HPA + N replicas in prod overlay (DEPLOYMENT.md §7)
  selector:
    matchLabels: { app: matching-engine }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: matching-engine }
    spec:
      # The journal schema (migrations/NNNN_*.sql from the matching-engine-migrations ConfigMap, applied
      # in name order; every file is safe to re-run).
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              set -- /migrations/[0-9]*.sql
              [ -e "$1" ] || { echo "no migrations mounted"; exit 1; }
              for f in "$@"; do
                echo "applying $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - { name: DATABASE_URL, valueFrom: { configMapKeyRef: { name: matching-engine-env, key: DATABASE_URL } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      containers:
        - name: matching-engine
          image: 1trade/matching-engine:dev
          ports: [{ containerPort: 8087 }]
          envFrom:
            - configMapRef: { name: otel-env, optional: true }   # OTLP endpoint for traces; created by install-data-plane.sh OBS=1
            - configMapRef: { name: matching-engine-env }
            - secretRef: { name: platform-auth }   # PLATFORM_JWT_SECRET (verify tenant JWTs); SERVICE_TOKEN (fund the paper liquidity account)
            - secretRef: { name: ledger-settle }   # SETTLE_SERVICE_TOKEN — the engine's own reserve/settle token (ADR-0004)
          # The engine replays its journal before it listens; give recovery up to 5 minutes before the
          # liveness probe may restart it.
          startupProbe:
            httpGet: { path: /healthz, port: 8087 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /healthz, port: 8087 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8087 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless 'nonroot' UID — numeric so kubelet can verify non-root
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: migrations
          configMap: { name: matching-engine-migrations }
