apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-ledger
  labels: { app: credit-ledger }
spec:
  replicas: 1                       # local; HPA + 5 replicas in prod overlay (DEPLOYMENT.md §7)
  selector:
    matchLabels: { app: credit-ledger }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: credit-ledger }
    spec:
      # Apply migrations before the service starts (idempotent: CREATE ... IF NOT EXISTS).
      # SQL comes from the credit-ledger-migrations ConfigMap: the shared types.sql plus every
      # services/credit-ledger/migrations/NNNN_*.sql.
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # types.sql first (the service migrations FK to credit_types), then a glob — not a
              # hardcoded list. A hardcoded list is how platform-core's 0007 was mounted but silently
              # never applied; the same trap would have skipped 0003_cash.sql here. Shell globbing
              # sorts lexically, which the NNNN_ prefixes make the intended order.
              [ -e /migrations/types.sql ] || { echo "types.sql not mounted"; exit 1; }
              set -- /migrations/types.sql /migrations/[0-9]*.sql
              [ -e "$2" ] || { echo "no service migrations mounted"; exit 1; }
              for f in "$@"; do
                echo "applying $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - { name: DATABASE_URL, valueFrom: { configMapKeyRef: { name: credit-ledger-env, key: DATABASE_URL } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      containers:
        - name: credit-ledger
          image: 1trade/credit-ledger:dev
          ports: [{ containerPort: 8002 }]
          envFrom:
            - configMapRef: { name: otel-env, optional: true }   # OTLP endpoint for traces; created by install-data-plane.sh OBS=1
            - configMapRef: { name: credit-ledger-env }
            - secretRef: { name: platform-auth }   # shared PLATFORM_JWT_SECRET — verifies platform-core JWTs (F02↔F05)
            # SETTLE_SERVICE_TOKEN — the matching-engine's own bearer for /v1/credits/settle-trade.
            # Its own Secret, mounted only here and in matching-engine: putting it in the shared
            # platform-auth would hand every service the power to settle trades between tenants.
            # Optional: absent means settlement refuses every caller (403), which is the safe default.
            - secretRef: { name: ledger-settle, optional: true }
          livenessProbe:
            httpGet: { path: /healthz, port: 8002 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8002 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless 'nonroot' UID — numeric so kubelet can verify non-root
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: migrations
          configMap: { name: credit-ledger-migrations }
