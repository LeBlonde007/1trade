# Example: a Kueue-admitted job in the `inference` queue, requesting the mock GPU resource.
# It starts suspended; Kueue admits it against cq-inference's quota and unsuspends it. Proves the
# quota-admission path (the F12 control plane will create the same shape).
#   kubectl apply -f examples/kueue-inference-job.yaml
#   kubectl get workloads -n default            # see it Admitted
#   kubectl get pods -n default -l job-name=mock-infer-job -o wide   # placed on the mock-GPU node
apiVersion: batch/v1
kind: Job
metadata:
  name: mock-infer-job
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: inference
spec:
  parallelism: 2
  completions: 2
  suspend: true                 # Kueue unsuspends on admission
  backoffLimit: 0
  template:
    spec:
      nodeSelector:
        exascale.io/gpu: mock
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo kueue-admitted; sleep 30"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              exascale.io/gpu: "1"
            limits:
              exascale.io/gpu: "1"
      restartPolicy: Never
