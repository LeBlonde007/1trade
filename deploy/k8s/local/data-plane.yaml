# Exascale — local core data plane (dev only: ephemeral, no HA/persistence — that's prod's job).
# Postgres (state) · TimescaleDB (time-series) · Redis (cache/order-books) · NATS JetStream (events).
# Applied by install-data-plane.sh / `make data-plane`. Matches the ports in LOCAL_DEV.md / .env.example.
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: data, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: exascale }
            - { name: POSTGRES_PASSWORD, value: exascale }
            - { name: POSTGRES_DB, value: exascale }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "exascale"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: data }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: timescaledb, namespace: data, labels: { app: timescaledb } }
spec:
  replicas: 1
  selector: { matchLabels: { app: timescaledb } }
  template:
    metadata: { labels: { app: timescaledb } }
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.17.2-pg16
          env:
            - { name: POSTGRES_USER, value: exascale }
            - { name: POSTGRES_PASSWORD, value: exascale }
            - { name: POSTGRES_DB, value: exascale_ts }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "exascale"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: timescaledb, namespace: data }
spec:
  selector: { app: timescaledb }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: data, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: data }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nats, namespace: data, labels: { app: nats } }
spec:
  replicas: 1
  selector: { matchLabels: { app: nats } }
  template:
    metadata: { labels: { app: nats } }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-m", "8222"]   # JetStream + HTTP monitoring (/healthz on 8222)
          ports:
            - { containerPort: 4222 }
            - { containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: nats, namespace: data }
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
