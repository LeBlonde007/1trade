# Two public hosts for the sandbox:
#   • TRADE1_SANDBOX_HOST      (e.g. sandbox.1trade.ai)    → the web app (browser).
#   • TRADE1_SANDBOX_API_HOST  (e.g. sandboxapi.1trade.ai) → the JSON API (1trade CLI + clients),
#       /v1/* routed by path prefix: /v1/auth,/v1/account,/v1/billing → platform-core ·
#       /v1/credits → credit-ledger · /v1/models,/v1/chat → inference-gateway · /v1/compute → compute.
# The api host also serves the web app at "/" so a browser hitting it gets a page, not a 404. The web
# app's own BFF (/api/*) talks to the services in-cluster (ClusterIP), so the browser only needs the
# web host. Both A records must point at the node IP; for TLS both must resolve before deploy.
#
# SECURITY model for a publicly-reachable API:
#   • TRADE1_ENV=sandbox (patch-env-sandbox.yaml) makes the credit-ledger stop trusting the
#     `X-Dev-Tenant` dev auth shortcut — the server rejects it.
#   • The strip-dev-headers middleware below is defence-in-depth: it deletes X-Dev-Tenant / X-Dev-Paper
#     at the edge for every request to these hosts, so the bypass can never be invoked from outside.
#   • Credit creation (/v1/credits/mint|burn|debit|purchase) needs the internal SERVICE_TOKEN, which is
#     never public — those endpoints 401 from the internet. The CLI uses only tenant-JWT endpoints.
#
# k3s ships Traefik as the default IngressController (class `traefik`). HTTP works as soon as DNS points
# at the node. HTTPS activates when scripts/deploy-sandbox.sh is run with TLS=1 (a real domain): it
# installs cert-manager + a `letsencrypt` ClusterIssuer, which mints one SAN cert (both hosts) into
# `web-tls` — the annotation + tls block are inert until then, so plain HTTP keeps working meanwhile.
apiVersion: traefik.io/v1alpha1 # Traefik v3 (k3s default). Older k3s ships traefik.containo.us/v1alpha1.
kind: Middleware
metadata:
  name: strip-dev-headers
spec:
  headers:
    customRequestHeaders:
      X-Dev-Tenant: "" # empty value ⇒ Traefik removes the header from the inbound request
      X-Dev-Paper: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 1trade-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt # inert until cert-manager + this issuer exist (TLS=1)
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-dev-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [TRADE1_SANDBOX_HOST, TRADE1_SANDBOX_API_HOST] # one SAN cert covers both
      secretName: web-tls
  rules:
    - host: TRADE1_SANDBOX_HOST # web app (browser); the BFF /api/* proxies to services in-cluster
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } }
    - host: TRADE1_SANDBOX_API_HOST # JSON API for the 1trade CLI + external clients
      http:
        paths:
          - { path: /v1/auth, pathType: Prefix, backend: { service: { name: platform-core, port: { number: 8001 } } } }
          - { path: /v1/account, pathType: Prefix, backend: { service: { name: platform-core, port: { number: 8001 } } } }
          - { path: /v1/billing, pathType: Prefix, backend: { service: { name: platform-core, port: { number: 8001 } } } }
          - { path: /v1/conversations, pathType: Prefix, backend: { service: { name: platform-core, port: { number: 8001 } } } }
          - { path: /v1/files, pathType: Prefix, backend: { service: { name: platform-core, port: { number: 8001 } } } }
          - { path: /v1/credits, pathType: Prefix, backend: { service: { name: credit-ledger, port: { number: 8002 } } } }
          - { path: /v1/models, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/chat, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/images, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/audio, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/videos, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/video, pathType: Prefix, backend: { service: { name: inference-gateway, port: { number: 8085 } } } }
          - { path: /v1/compute, pathType: Prefix, backend: { service: { name: compute-control, port: { number: 8086 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 3000 } } } } # friendly landing
