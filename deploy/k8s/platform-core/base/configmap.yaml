# platform-core non-secret config. PLATFORM_JWT_SECRET is NOT here — it's the shared `platform-auth`
# Secret (created out-of-band: SOPS/Vault in prod, `kubectl create secret` / Tilt locally), read by
# both platform-core (issuer) and credit-ledger (verifier).
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-core-env
data:
  TRADE1_ENV: "dev"
  PLATFORM_ADDR: ":8001"
  DATABASE_URL: "postgres://1trade:1trade@postgres.data.svc.cluster.local:5432/1trade"
  # Transactional email → Mailpit (local SMTP sink + web UI). APP_BASE_URL is the web app the
  # verification link points at, so it must be reachable from the developer's browser.
  SMTP_ADDR: "mailpit.data.svc.cluster.local:1025"
  APP_BASE_URL: "http://localhost:3000"
