apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
  labels: { app: platform-core }
spec:
  replicas: 1                       # local; HPA + 3 replicas in prod overlay (DEPLOYMENT.md §7)
  selector:
    matchLabels: { app: platform-core }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: platform-core }
    spec:
      # Apply migrations before the service starts (idempotent: CREATE ... IF NOT EXISTS).
      # SQL comes from the platform-core-migrations ConfigMap (0001_init.sql … 0006_conversations.sql).
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for f in /migrations/0001_init.sql /migrations/0002_billing.sql /migrations/0003_accounts.sql /migrations/0004_gaps.sql /migrations/0005_kyc.sql /migrations/0006_conversations.sql; do
                echo "applying $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - { name: DATABASE_URL, valueFrom: { configMapKeyRef: { name: platform-core-env, key: DATABASE_URL } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      containers:
        - name: platform-core
          image: exascale/platform-core:dev
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: platform-core-env }
            - secretRef: { name: platform-auth }   # PLATFORM_JWT_SECRET — the signing key it issues with
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless 'nonroot' UID — numeric so kubelet can verify non-root
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: migrations
          configMap: { name: platform-core-migrations }
