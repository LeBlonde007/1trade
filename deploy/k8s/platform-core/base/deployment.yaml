apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
  labels: { app: platform-core }
spec:
  replicas: 1                       # local; HPA + 3 replicas in prod overlay (DEPLOYMENT.md §7)
  selector:
    matchLabels: { app: platform-core }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: platform-core }
    spec:
      # Apply migrations before the service starts (idempotent: CREATE ... IF NOT EXISTS).
      # SQL comes from the platform-core-migrations ConfigMap (every migrations/NNNN_*.sql, applied in name order).
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # Glob, not a hardcoded list. Adding a migration previously meant editing three
              # places (the file, the Tiltfile configmap, and this list); missing this one meant
              # the migration was mounted but silently never applied — which is exactly what
              # happened to 0007. Shell globbing sorts lexically, and the NNNN_ prefixes make that
              # the intended order.
              set -- /migrations/[0-9]*.sql
              [ -e "$1" ] || { echo "no migrations mounted"; exit 1; }
              for f in "$@"; do
                echo "applying $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - { name: DATABASE_URL, valueFrom: { configMapKeyRef: { name: platform-core-env, key: DATABASE_URL } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      containers:
        - name: platform-core
          image: 1trade/platform-core:dev
          ports: [{ containerPort: 8001 }]
          envFrom:
            - configMapRef: { name: otel-env, optional: true }   # OTLP endpoint for traces; created by install-data-plane.sh OBS=1
            - configMapRef: { name: platform-core-env }
            - secretRef: { name: platform-auth }   # PLATFORM_JWT_SECRET — the signing key it issues with
            - secretRef: { name: billing-bank, optional: true }   # WIRE_* receiving-bank details (v1.9); absent = wires unavailable
            - secretRef: { name: platform-mfa, optional: true }   # MFA_ENC_KEY (v1.7); absent = derived from the JWT secret
          livenessProbe:
            httpGet: { path: /healthz, port: 8001 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless 'nonroot' UID — numeric so kubelet can verify non-root
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        - name: migrations
          configMap: { name: platform-core-migrations }
