apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-control
  labels: { app: compute-control }
spec:
  replicas: 1                       # local; HPA + N replicas in prod overlay (DEPLOYMENT.md §7)
  selector:
    matchLabels: { app: compute-control }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: compute-control }
    spec:
      # Apply compute-control's migrations (supply registry) before it starts. Idempotent; a glob,
      # never a hardcoded list, so a new NNNN_*.sql cannot be skipped.
      initContainers:
        - name: migrate
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              set -- /migrations/[0-9]*.sql
              [ -e "$1" ] || { echo "no migrations mounted"; exit 1; }
              for f in "$@"; do
                echo "applying $f"; psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
          env:
            - { name: DATABASE_URL, valueFrom: { configMapKeyRef: { name: compute-control-env, key: DATABASE_URL } } }
          volumeMounts:
            - { name: migrations, mountPath: /migrations }
      containers:
        - name: compute-control
          image: 1trade/compute-control:dev
          ports: [{ containerPort: 8086 }]
          envFrom:
            - configMapRef: { name: otel-env, optional: true }   # OTLP endpoint for traces; created by install-data-plane.sh OBS=1
            - configMapRef: { name: compute-control-env }
            - secretRef: { name: platform-auth }   # PLATFORM_JWT_SECRET (verify tenant JWTs) + SERVICE_TOKEN (internal scheduling)
          livenessProbe:
            httpGet: { path: /healthz, port: 8086 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8086 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless 'nonroot' UID — numeric so kubelet can verify non-root
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        # compute-control-migrations: services/compute-control/migrations/*.sql, created out-of-band
        # (Tiltfile locally / CI) like the other services' migration ConfigMaps.
        - name: migrations
          configMap: { name: compute-control-migrations }
