# TEMPLATE — committed in PLAINTEXT, contains NO real secrets. Shape of the `ledger-settle` Secret.
#
#   cp deploy/secrets/ledger-settle.example.yaml deploy/secrets/ledger-settle.sops.yaml
#   # fill a real value (openssl rand -base64 32), then:
#   scripts/secrets.sh encrypt deploy/secrets/ledger-settle.sops.yaml
#
# SETTLE_SERVICE_TOKEN is the matching-engine's OWN bearer for credit-ledger
# POST /v1/credits/settle-trade (credit.yaml v1.1, ADR-0004). Mount it ONLY in credit-ledger and
# matching-engine — never in the shared platform-auth — because a settlement moves value between two
# tenants. If absent, the ledger refuses every settlement (403).
apiVersion: v1
kind: Secret
metadata:
  name: ledger-settle
  namespace: default
type: Opaque
stringData:
  SETTLE_SERVICE_TOKEN: "REPLACE_ME__openssl_rand_base64_32"
