# TEMPLATE — committed in PLAINTEXT, contains NO real secrets. This documents the shape of the
# `platform-auth` Secret. To create the real (encrypted) one:
#
#   cp deploy/secrets/platform-auth.example.yaml deploy/secrets/platform-auth.sops.yaml
#   # fill real values (e.g. openssl rand -base64 48), then:
#   scripts/secrets.sh encrypt deploy/secrets/platform-auth.sops.yaml
#
# `platform-auth` is the shared Secret every Go service reads (envFrom in each Deployment):
#   - PLATFORM_JWT_SECRET — the HS256 key platform-core ISSUES tenant tokens with and every other
#     service VERIFIES them with. It MUST be identical across all services or auth breaks fleet-wide.
#   - SERVICE_TOKEN — the service-to-service bearer guarding internal endpoints (key introspection,
#     internal scheduling, KYC decision). Also identical across services.
apiVersion: v1
kind: Secret
metadata:
  name: platform-auth
  namespace: default
type: Opaque
stringData:
  PLATFORM_JWT_SECRET: "REPLACE_ME__openssl_rand_base64_48"
  SERVICE_TOKEN: "REPLACE_ME__openssl_rand_base64_48"
