<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>1Trade — Buy Credits</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --canvas:    #F8F7F4;
  --paper:     #FFFFFF;
  --sunken:    #F2EEE3;
  --inverse:   #0E0E0E;

  --t-1: #0A0B0E;
  --t-2: #4A4A45;
  --t-3: #8A8A82;
  --t-4: #B8B8B0;

  --bd:        rgba(14,14,14,0.10);
  --bd-strong: rgba(14,14,14,0.20);
  --bd-soft:   rgba(14,14,14,0.06);

  --brand:       #C8F25C;
  --brand-hover: #B8E548;
  --brand-soft:  rgba(200,242,92,0.18);
  --info:        #4A90E2;
  --pos:         #16A34A;
  --warn:        #D97706;
  --warn-soft:   rgba(217,119,6,0.10);

  --font-display: 'Inter Tight', system-ui, sans-serif;
  --font-sans:    'Inter', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--canvas);
  color: var(--t-1);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01";
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* Global icon defaults — inline SVGs without width/height fall back to 300×150 */
svg:not([width]):not([height]) { width: 14px; height: 14px; }
.wire-ref svg { width: 14px; height: 14px; vertical-align: -2px; }
.confirm-status svg { width: 14px; height: 14px; vertical-align: -2px; }
.preview svg { width: 12px; height: 12px; }

/* ===== TOP BAR ===== */
.topbar {
  height: 56px;
  background: var(--paper);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  padding: 0 32px;
  justify-content: space-between;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.005em;
  color: var(--t-1);
  text-decoration: none;
}
.brand .mark { width: 12px; height: 12px; background: var(--brand); display: inline-block; }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--t-3);
}
.topbar-right .balance {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--t-2);
}
.topbar-right .balance strong {
  color: var(--t-1);
  font-weight: 500;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.topbar-right .env-pill {
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--info);
  background: rgba(74,144,226,0.1);
  border: 1px solid rgba(74,144,226,0.25);
  border-radius: 2px;
  text-transform: uppercase;
  font-weight: 600;
}
.topbar-right a {
  color: var(--t-2);
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 0;
  text-decoration: none;
}
.topbar-right a:hover { color: var(--t-1); }

/* ===== PAGE ===== */
.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}
.page-header { margin-bottom: 32px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--t-3);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.eyebrow::before { content: ""; width: 5px; height: 5px; background: var(--brand); display: inline-block; }
.page-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  letter-spacing: -0.022em;
  line-height: 1.1;
  margin: 0 0 8px;
}
.page-subtitle {
  color: var(--t-2);
  font-size: 14px;
  margin: 0;
  max-width: 540px;
}

/* ===== PROGRESS DOTS ===== */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--paper);
  border: 1px solid var(--bd);
  border-radius: 2px;
  margin-bottom: 24px;
}
.step {
  position: relative;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  border-right: 1px solid var(--bd);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: background 120ms;
}
.step:last-child { border-right: 0; }
.step:hover { background: var(--sunken); }
.step.active { background: var(--paper); }
.step.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 2px;
  background: var(--t-1);
}
.step-num {
  width: 24px; height: 24px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--bd-strong);
  color: var(--t-3);
}
.step.active .step-num { background: var(--t-1); color: var(--paper); border-color: var(--t-1); }
.step.done .step-num { background: var(--t-1); color: var(--brand); border-color: var(--t-1); }
.step-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--t-3);
  text-transform: uppercase;
}
.step.active .step-label { color: var(--t-1); }
.step-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--t-1);
  letter-spacing: -0.005em;
}

/* ===== CARD ===== */
.card {
  background: var(--paper);
  border: 1px solid var(--bd);
  border-radius: 2px;
  margin-bottom: 32px;
}
.stack-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--t-1);
  color: var(--brand);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding: 5px 10px;
  font-weight: 600;
  position: relative;
  top: -16px;
}
.stack-tag svg {
  width: 11px; height: 11px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
}
.card-head {
  padding: 24px 28px 18px;
  border-bottom: 1px solid var(--bd-soft);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
}
.card-head .ttl {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
  margin: 6px 0 0;
  line-height: 1.25;
}
.card-head .lede {
  color: var(--t-2);
  font-size: 13.5px;
  margin: 4px 0 0;
}
.card-head .meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  letter-spacing: 0.06em;
  white-space: nowrap;
  padding-top: 4px;
}
.card-head .meta strong { color: var(--t-1); font-weight: 500; }

.card-body { padding: 24px 28px 24px; }
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px;
  border-top: 1px solid var(--bd-soft);
  background: var(--canvas);
}
.footer-hint {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.footer-hint svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; }

/* ===== LABELS ===== */
.field-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--t-2);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.field-label .req {
  color: var(--t-3);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: none;
  font-size: 11px;
  font-family: var(--font-sans);
}

/* ===== CURRENCY TOGGLE ===== */
.ccy-row {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.ccy-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--paper);
  border: 1px solid var(--bd-strong);
  border-radius: 2px;
  cursor: pointer;
  text-align: left;
  transition: background 120ms, border-color 120ms;
  font-family: inherit;
  color: var(--t-1);
}
.ccy-btn:hover { background: var(--canvas); }
.ccy-btn.active {
  background: var(--t-1);
  border-color: var(--t-1);
  color: var(--paper);
}
.ccy-btn .left {
  display: flex; align-items: center; gap: 10px;
}
.ccy-btn .sym {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.ccy-btn .code {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  font-weight: 600;
}
.ccy-btn .name {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--t-3);
  letter-spacing: 0;
}
.ccy-btn.active .name { color: rgba(232,230,224,0.6); }
.ccy-btn .rate {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  letter-spacing: 0.04em;
}
.ccy-btn.active .rate { color: rgba(232,230,224,0.6); }

/* ===== AMOUNT INPUT ===== */
.amount-wrap {
  display: flex;
  align-items: center;
  border: 1px solid var(--bd-strong);
  background: var(--paper);
  border-radius: 2px;
  margin-bottom: 12px;
  transition: border-color 120ms, box-shadow 120ms;
}
.amount-wrap:focus-within {
  border-color: var(--info);
  box-shadow: 0 0 0 2px rgba(74,144,226,0.18);
}
.amount-prefix {
  font-family: var(--font-mono);
  font-size: 32px;
  color: var(--t-3);
  padding: 0 12px 0 20px;
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}
.amount-input {
  flex: 1;
  height: 72px;
  border: 0;
  outline: 0;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--t-1);
  padding: 0 20px 0 0;
  font-variant-numeric: tabular-nums;
  width: 100%;
}
.amount-input::placeholder { color: var(--t-4); }
.amount-suffix {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--t-3);
  padding: 0 20px;
  font-weight: 600;
}

/* quick amounts */
.qa-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 24px;
}
.qa-btn {
  height: 32px;
  background: var(--paper);
  border: 1px solid var(--bd);
  border-radius: 2px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  color: var(--t-2);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  transition: background 120ms, border-color 120ms, color 120ms;
}
.qa-btn:hover { border-color: var(--bd-strong); color: var(--t-1); }
.qa-btn.active {
  background: var(--t-1);
  border-color: var(--t-1);
  color: var(--paper);
}

/* ===== CREDIT TYPE CARDS ===== */
.credit-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
.credit-card {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--bd-strong);
  border-radius: 2px;
  padding: 14px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: var(--t-1);
  transition: background 120ms, border-color 120ms;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 100px;
}
.credit-card:hover { background: var(--canvas); }
.credit-card.active {
  border-color: var(--t-1);
  background: var(--paper);
}
.credit-card.active::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid var(--t-1);
  border-radius: 2px;
  pointer-events: none;
}
.credit-card .ribbon {
  position: absolute;
  top: -1px; right: -1px;
  background: var(--brand);
  color: var(--inverse);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  padding: 2px 7px;
  text-transform: uppercase;
}
.credit-card .top-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--t-3);
  font-weight: 600;
}
.credit-card .symbol {
  width: 22px; height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 600;
}
.credit-card .name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--t-1);
  line-height: 1.2;
}
.credit-card .desc {
  font-size: 12px;
  color: var(--t-2);
  line-height: 1.4;
}
.credit-card .px {
  margin-top: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  font-variant-numeric: tabular-nums;
  padding-top: 4px;
  border-top: 1px dashed var(--bd);
}

.sub-select {
  width: 100%;
  height: 36px;
  border: 1px solid var(--bd-strong);
  border-radius: 2px;
  padding: 0 12px;
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--t-1);
  margin-top: 10px;
  outline: none;
}
.sub-select:focus { border-color: var(--info); box-shadow: 0 0 0 2px rgba(74,144,226,0.18); }

/* ===== LIVE PREVIEW ===== */
.preview {
  margin-top: 24px;
  border: 1px solid var(--bd-strong);
  background: var(--paper);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.preview::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--brand);
}
.preview-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 18px;
  border-bottom: 1px solid var(--bd-soft);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--t-3);
}
.preview-head .live {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--t-2);
}
.preview-head .live .pulse {
  width: 6px; height: 6px;
  background: var(--pos);
  border-radius: 50%;
  animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(22,163,74,0.6); }
  70% { box-shadow: 0 0 0 6px rgba(22,163,74,0); }
  100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
}
.preview-body { padding: 18px 22px; }
.preview-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 8px 0;
}
.preview-row .lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--t-3);
  font-weight: 600;
}
.preview-row .val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--t-1);
  letter-spacing: -0.005em;
}
.preview-row .val .unit {
  font-size: 12px;
  color: var(--t-3);
  margin-left: 4px;
  font-weight: 400;
  letter-spacing: 0.04em;
}
.preview-row.major .val { font-size: 22px; }
.preview-row.major.receive .val { color: var(--t-1); }
.preview-divider {
  height: 1px;
  background: var(--bd-soft);
  margin: 8px 0;
}
.preview-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  letter-spacing: 0.04em;
}
.preview-sub .pos { color: var(--pos); }

/* ===== BUTTONS ===== */
.btn {
  height: 44px;
  padding: 0 20px;
  border-radius: 2px;
  border: 1px solid transparent;
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 120ms, border-color 120ms, color 120ms, transform 80ms;
}
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--t-1);
  color: var(--paper);
  border-color: var(--t-1);
}
.btn.primary:hover { background: #222; border-color: #222; }
.btn.primary:disabled {
  background: var(--sunken);
  color: var(--t-4);
  border-color: var(--bd);
  cursor: not-allowed;
  transform: none;
}
.btn.secondary {
  background: var(--paper);
  color: var(--t-1);
  border-color: var(--bd-strong);
}
.btn.secondary:hover { background: var(--canvas); border-color: rgba(14,14,14,0.32); }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.btn.lg { height: 48px; padding: 0 24px; font-size: 15px; }

/* ===== STEP 2: PAYMENT METHODS ===== */
.pm-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.pm-card {
  background: var(--paper);
  border: 1px solid var(--bd-strong);
  border-radius: 2px;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 120ms;
}
.pm-card.active { border-color: var(--t-1); }
.pm-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
}
.pm-radio {
  width: 16px; height: 16px;
  border: 1.5px solid var(--bd-strong);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.pm-card.active .pm-radio {
  border-color: var(--t-1);
}
.pm-card.active .pm-radio::after {
  content: "";
  width: 8px; height: 8px;
  background: var(--t-1);
  border-radius: 50%;
}
.pm-head .pm-info { flex: 1; min-width: 0; }
.pm-head .pm-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--t-1);
  letter-spacing: -0.005em;
}
.pm-head .pm-sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--t-3);
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.pm-head .pm-icons {
  display: flex;
  gap: 6px;
}
.pm-head .pm-icons .ic {
  height: 22px;
  padding: 0 7px;
  border: 1px solid var(--bd);
  border-radius: 2px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--t-3);
  display: inline-flex;
  align-items: center;
}
.pm-body {
  display: none;
  padding: 0 18px 18px 48px;
  border-top: 1px solid var(--bd-soft);
  padding-top: 18px;
  margin-top: -1px;
  background: var(--canvas);
}
.pm-card.active .pm-body { display: block; }

/* Stripe-ish form */
.stripe-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.stripe-grid .col2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stripe-grid .col3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
.f-input {
  display: flex;
  align-items: center;
  height: 38px;
  background: var(--paper);
  border: 1px solid var(--bd-strong);

  <button class="vt" id="vtStacked" data-mode="stacked">All 3 stacked</button>

<script>
/* =====================================================
   STATE
   ===================================================== */
const STATE = {
  step: 0,
  view: 'flow',         // 'flow' | 'stacked'
  ccy: 'USD',           // 'USD' | 'JPY'
  amount: 1000,         // in selected currency
  amountStr: '1,000',
  creditType: 'AI_INDEX', // 'AI_INDEX' | 'CASH' | 'SUB'
  subCredit: 'TEXT',    // when creditType === 'SUB'
  payment: 'wire',      // 'card' | 'wire' | 'ach'
  termsAccepted: false,
  // for live preview wobble
  livePrice: 0.001005,  // USD per AI credit
};

const CCY_CFG = {
  USD: { sym: '$',  code: 'USD', name: 'US Dollar',     decimals: 2, rate: 1,      sample: 1000, qa: [100, 500, 1000, 5000, 10000, 50000] },
};

const CREDIT_TYPES = {
  AI_INDEX: {
    short: 'AI',
    badge: 'AI-IDX',
    name: 'AI Index Credits',
    desc: 'Composite reference credit. Redeemable across all inference categories.',
    pxUsd: 0.001005,
    decimals: 6,
    featured: true,
  },
  CASH: {
    short: '$',
    badge: 'CASH',
    name: 'Cash Balance',
    desc: 'Hold as USD on the venue. Convert on demand.',
    pxUsd: 1,
    decimals: 2,
    featured: false,
  },
  SUB: {
    short: 'SC',
    badge: 'SUB',
    name: 'Specific Sub-Credit',
    desc: 'Single inference category. Higher precision, thinner book.',
    pxUsd: 0.001210,
    decimals: 6,
    featured: false,
  },
};

const SUB_CREDITS = [
  { id: 'TEXT',   label: 'TEXT-INDEX  ·  text generation',     pxUsd: 0.001210 },
  { id: 'SPEECH', label: 'SPEECH-INDEX  ·  speech synthesis',  pxUsd: 0.001200 },
  { id: 'IMAGE',  label: 'IMAGE-INDEX  ·  image generation',   pxUsd: 0.008000 },
  { id: 'VIDEO',  label: 'VIDEO-INDEX  ·  video generation',   pxUsd: 0.250000 },
  { id: 'NICHE',  label: 'NICHE-INDEX  ·  long-tail tasks',    pxUsd: 0.000400 },
];

/* =====================================================
   HELPERS
   ===================================================== */
function parseAmount(str) {
  const cleaned = String(str).replace(/[^0-9.]/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function fmtAmount(n, ccy) {
  const cfg = CCY_CFG[ccy];
  return n.toLocaleString('en-US', { minimumFractionDigits: cfg.decimals, maximumFractionDigits: cfg.decimals });
}
function fmtUSD(n, dec = 2) {
  return n.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function getActiveCreditPx() {
  if (STATE.creditType === 'AI_INDEX') return CREDIT_TYPES.AI_INDEX.pxUsd;
  if (STATE.creditType === 'CASH') return 1;
  const sub = SUB_CREDITS.find(s => s.id === STATE.subCredit);
  return sub ? sub.pxUsd : CREDIT_TYPES.SUB.pxUsd;
}
function getActiveCreditDecimals() {
  if (STATE.creditType === 'CASH') return 2;
  return 0;  // credit counts are integers
}
function amountInUSD() {
  const cfg = CCY_CFG[STATE.ccy];
  return STATE.amount / cfg.rate;
}
function creditsReceived() {
  if (STATE.creditType === 'CASH') return amountInUSD();
  const px = getActiveCreditPx();
  return Math.floor(amountInUSD() / px);
}

/* =====================================================
   ICONS
   ===================================================== */
const I = {
  arr:       '<svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg>',
  arrL:      '<svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg>',
  check:     '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg>',
  lock:      '<svg viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  copy:      '<svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><rect x="5" y="5" width="8" height="8"/><path d="M3 11V3h8"/></svg>',
  info:      '<svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 5v.5"/></svg>',
};

/* =====================================================
   STEPS DEFINITIONS
   ===================================================== */
const STEP_DEFS = [
  { key: 'amount',  label: 'Amount',   title: 'Choose amount & credit type', eyebrow: 'Step 01 · Order' },
  { key: 'payment', label: 'Payment',  title: 'How will you pay?',           eyebrow: 'Step 02 · Settlement' },
  { key: 'confirm', label: 'Confirm',  title: 'Order placed',                eyebrow: 'Step 03 · Confirmation' },
];

/* =====================================================
   RENDERERS
   ===================================================== */
function renderApp() {
  const root = document.getElementById('app');
  if (STATE.view === 'stacked') {
    root.innerHTML = `
      <div class="page-header">
        <div class="eyebrow">Buy credits · review view</div>
        <h1 class="page-title">All three steps</h1>
        <p class="page-subtitle">Stacked rendering of the full purchase flow. State is shared — adjust amounts or methods anywhere and every step reflects the change.</p>
      </div>
      <div class="stacked-banner">— Stacked design view · all 3 steps shown · validation &amp; navigation suppressed</div>
      ${[0,1,2].map(i => `
        <div>
          <span class="stack-tag">${I.check} Step ${String(i+1).padStart(2,'0')} — ${STEP_DEFS[i].title}</span>
          ${stepCard(i, true)}
        </div>
      `).join('')}
    `;
  } else {
    root.innerHTML = `
      <div class="page-header">
        <div class="eyebrow">Buy credits · funding</div>
        <h1 class="page-title">Add funds to your account.</h1>
        <p class="page-subtitle">Convert USD into AI Index credits or hold as cash. No conversion fee on bulk purchase. Settlement instant on card, 1-3 business days on wire.</p>
      </div>
      ${renderStepper()}
      ${stepCard(STATE.step, false)}
    `;
  }
  attachListeners();
  if (STATE.view === 'flow' && STATE.step === 0) startLivePriceTick();
}

function renderStepper() {
  return `
    <div class="steps">
      ${STEP_DEFS.map((s, i) => `
        <button class="step ${i === STATE.step ? 'active' : ''} ${i < STATE.step ? 'done' : ''}" data-go="${i}">
          <span class="step-num">${i < STATE.step ? I.check : String(i+1).padStart(2,'0')}</span>
          <span class="step-info">
            <span class="step-label">${s.label}</span>
            <span class="step-title">${s.title}</span>
          </span>
        </button>
      `).join('')}
    </div>
  `;
}

function stepCard(idx, isStacked) {
  const def = STEP_DEFS[idx];
  const body = idx === 0 ? renderStep1()
              : idx === 1 ? renderStep2()
              : renderStep3();
  const footer = isStacked ? `
    <div class="card-footer">
      <span class="footer-hint">${I.lock} Stacked view · controls disabled</span>
      <div style="display:flex; gap: 8px;">
        ${idx > 0 ? `<button class="btn secondary" disabled>${I.arrL} Back</button>` : ''}
        ${idx < 2 ? `<button class="btn primary" disabled>${idx === 1 ? 'Submit payment' : 'Continue'} ${I.arr}</button>` : ''}
      </div>
    </div>
  ` : renderStepFooter(idx);
  return `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="eyebrow"><span style="width:5px;height:5px;background:var(--brand);display:inline-block;"></span> ${def.eyebrow}</div>
          <h2 class="ttl">${def.title}</h2>
          ${idx === 2 ? '' : `<p class="lede">${idx === 0 ? 'Pick the amount and what you\'d like to hold the balance as.' : 'Choose how to settle. Wire is recommended for orders over $25,000.'}</p>`}
        </div>
        <div class="meta">
          <strong>${String(idx+1).padStart(2,'0')}</strong> / 03 · <span style="color:var(--t-3);">${idx === 2 ? 'Order ' + ORDER_ID : 'In progress'}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="step-content">${body}</div>
      </div>
      ${footer}
    </div>
  `;
}

function renderStepFooter(idx) {
  if (idx === 2) return ''; // confirmation has its own actions
  const validAdvance = idx === 1 ? STATE.termsAccepted : (STATE.amount > 0);
  return `
    <div class="card-footer">
      <span class="footer-hint">
        ${idx === 0
          ? `${I.lock} Live rate · refreshed every 5 s · TLS 1.3 settlement`
          : `${I.lock} Encrypted in transit · PCI-DSS Level 1`}
      </span>
      <div style="display:flex; gap: 8px;">
        ${idx > 0 ? `<button class="btn secondary" id="btnBack">${I.arrL} Back</button>` : ''}
        <button class="btn primary" id="btnNext" ${validAdvance ? '' : 'disabled'}>
          ${idx === 1 ? 'Submit payment' : 'Continue'} ${I.arr}
        </button>
      </div>
    </div>
  `;
}

/* =====================================================
   STEP 1 — Amount
   ===================================================== */
function renderStep1() {
  const cfg = CCY_CFG[STATE.ccy];
  const usd = amountInUSD();
  const credits = creditsReceived();
  const rate = STATE.creditType === 'CASH' ? 1 : getActiveCreditPx();
  const ratePerOne = STATE.ccy === 'USD' ? rate : rate * cfg.rate;
  const creditLabel = STATE.creditType === 'CASH' ? 'USD'
                    : STATE.creditType === 'SUB' ? SUB_CREDITS.find(s => s.id === STATE.subCredit).id + ' credits'
                    : 'AI Index credits';

  return `
    <div class="field-label"><span>— Amount</span><span class="req">${cfg.code}</span></div>
    <div class="amount-wrap">
      <span class="amount-prefix">${cfg.sym}</span>
      <input class="amount-input" type="text" inputmode="decimal" value="${STATE.amountStr}" id="amtInput" autocomplete="off" placeholder="0"/>
      <span class="amount-suffix">${cfg.code}</span>
    </div>
    <div class="qa-row">
      ${cfg.qa.map(v => `
        <button class="qa-btn ${STATE.amount === v ? 'active' : ''}" data-qa="${v}">
          ${cfg.sym}${v.toLocaleString('en-US')}
        </button>
      `).join('')}
    </div>

    <div class="field-label"><span>— Receive credits as</span></div>
    <div class="credit-row">
      ${['AI_INDEX', 'CASH', 'SUB'].map(k => {
        const c = CREDIT_TYPES[k];
        const active = STATE.creditType === k;
        return `
          <button class="credit-card ${active ? 'active' : ''}" data-credit="${k}">
            ${c.featured ? '<span class="ribbon">Recommended</span>' : ''}
            <div class="top-line">
              <span class="symbol" style="background: ${k === 'AI_INDEX' ? 'var(--brand)' : k === 'CASH' ? 'var(--sunken)' : 'rgba(74,144,226,0.18)'}; color: ${k === 'AI_INDEX' ? 'var(--t-1)' : k === 'CASH' ? 'var(--t-1)' : 'var(--info)'};">${c.short}</span>
              <span>${c.badge}</span>
            </div>
            <div class="name">${c.name}</div>
            <div class="desc">${c.desc}</div>
            <div class="px">${k === 'CASH' ? 'Holds USD · convert anytime' : '$' + (k === 'AI_INDEX' ? CREDIT_TYPES.AI_INDEX.pxUsd.toFixed(6) : '0.00121') + ' / credit'}</div>
          </button>
        `;
      }).join('')}
    </div>

    ${STATE.creditType === 'SUB' ? `
      <select class="sub-select" id="subSelect">
        ${SUB_CREDITS.map(s => `<option value="${s.id}" ${s.id === STATE.subCredit ? 'selected' : ''}>${s.label} · $${s.pxUsd.toFixed(6)}</option>`).join('')}
      </select>
    ` : ''}

    <div class="preview">
      <div class="preview-head">
        <span>— Order preview</span>
        <span class="live"><span class="pulse"></span>Live · refreshes ~5s</span>
      </div>
      <div class="preview-body">
        <div class="preview-row major">
          <span class="lbl">You pay</span>
          <span class="val">${cfg.sym}${fmtAmount(STATE.amount, STATE.ccy)}<span class="unit">${cfg.code}</span></span>
        </div>
        <div class="preview-row major receive">
          <span class="lbl">You receive</span>

/* =====================================================
   LISTENERS
   ===================================================== */
function attachListeners() {
  // stepper
  document.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.go, 10);
      STATE.step = i;
      renderApp();
    });
  });

  // currency
  document.querySelectorAll('[data-ccy]').forEach(el => {
    el.addEventListener('click', () => {
      const newCcy = el.dataset.ccy;
      if (newCcy !== STATE.ccy) {
        // convert displayed amount
        const oldCfg = CCY_CFG[STATE.ccy];
        const newCfg = CCY_CFG[newCcy];
        STATE.ccy = newCcy;
        STATE.amount = newCfg.sample;
        STATE.amountStr = fmtAmount(STATE.amount, STATE.ccy);
        renderApp();
      }
    });
  });

  // amount input
  const amt = document.getElementById('amtInput');
  if (amt) {
    amt.addEventListener('input', (e) => {
      const n = parseAmount(e.target.value);
      STATE.amount = n;
      STATE.amountStr = e.target.value;
      updatePreview();
    });
    amt.addEventListener('blur', () => {
      STATE.amountStr = fmtAmount(STATE.amount, STATE.ccy);
      amt.value = STATE.amountStr;
    });
  }

  // quick amounts
  document.querySelectorAll('[data-qa]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.amount = parseInt(el.dataset.qa, 10);
      STATE.amountStr = fmtAmount(STATE.amount, STATE.ccy);
      renderApp();
    });
  });

  // credit type
  document.querySelectorAll('[data-credit]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.creditType = el.dataset.credit;
      renderApp();
    });
  });

  const subSel = document.getElementById('subSelect');
  if (subSel) {
    subSel.addEventListener('change', () => {
      STATE.subCredit = subSel.value;
      updatePreview();
    });
  }

  // payment method
  document.querySelectorAll('[data-pm]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.payment = el.dataset.pm;
      renderApp();
    });
  });

  // terms
  const terms = document.getElementById('termsRow');
  if (terms) {
    terms.addEventListener('click', (e) => {
      e.preventDefault();
      STATE.termsAccepted = !STATE.termsAccepted;
      renderApp();
    });
  }

  // back / next
  const btnBack = document.getElementById('btnBack');
  if (btnBack) btnBack.addEventListener('click', () => { STATE.step = Math.max(0, STATE.step - 1); renderApp(); });
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.addEventListener('click', () => { STATE.step = Math.min(2, STATE.step + 1); renderApp(); });

  // confirmation actions
  ['goWallet', 'goTrade'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('click', () => {
      // simulate navigation
      el.innerHTML = '<span class="spinner" style="width:14px;height:14px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin 700ms linear infinite;"></span> Routing…';
    });
  });
  const done = document.getElementById('doneBtn');
  if (done) done.addEventListener('click', () => {
    STATE.step = 0;
    STATE.termsAccepted = false;
    renderApp();
  });
}

/* update only the preview block on amount change for smoother typing */
function updatePreview() {
  const cfg = CCY_CFG[STATE.ccy];
  const credits = creditsReceived();
  const recv = document.getElementById('receiveVal');
  if (recv) {
    const creditLabel = STATE.creditType === 'CASH' ? 'USD' : STATE.creditType === 'SUB' ? STATE.subCredit + ' credits' : 'AI Index credits';
    recv.innerHTML = `${STATE.creditType === 'CASH' ? '$' + fmtUSD(credits, 2) : credits.toLocaleString('en-US')}<span class="unit">${creditLabel}</span>`;
  }
  // pay
  const payVal = document.querySelector('.preview-row.major .val');
  if (payVal) payVal.innerHTML = `${cfg.sym}${fmtAmount(STATE.amount, STATE.ccy)}<span class="unit">${cfg.code}</span>`;
}

/* =====================================================
   LIVE PRICE TICKER (subtle)
   ===================================================== */
let priceTimer = null;
function startLivePriceTick() {
  if (priceTimer) clearInterval(priceTimer);
  priceTimer = setInterval(() => {
    // tiny mean-reverting drift
    const delta = (Math.random() - 0.5) * 0.0000015;
    STATE.livePrice = Math.max(0.000990, Math.min(0.001020, STATE.livePrice + delta));
    CREDIT_TYPES.AI_INDEX.pxUsd = STATE.livePrice;
    // Only refresh the receive line in step 1
    if (STATE.view === 'flow' && STATE.step === 0) {
      updatePreview();
    }
  }, 5000);
}

/* =====================================================
   VIEW TOGGLE
   ===================================================== */
document.getElementById('vtFlow').addEventListener('click', () => {
  STATE.view = 'flow';
  document.getElementById('vtFlow').classList.add('active');
  document.getElementById('vtStacked').classList.remove('active');
  renderApp();
});
document.getElementById('vtStacked').addEventListener('click', () => {
  STATE.view = 'stacked';
  document.getElementById('vtStacked').classList.add('active');
  document.getElementById('vtFlow').classList.remove('active');
  renderApp();
});

/* =====================================================
   BOOT
   ===================================================== */
renderApp();
</script>
