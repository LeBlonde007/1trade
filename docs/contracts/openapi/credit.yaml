openapi: 3.0.3
info:
  title: 1Trade Credit Ledger API
  version: 1.3.0
  description: >
    Per-tenant prepaid credit balances, append-only hash-chained transactions, purchases, and
    conversions. Owned by `credit-ledger`; see docs/contracts/credit-types.md and
    docs/plans/features/F05-prepaid-credit-ledger.md. ALL amounts are fixed-point decimals
    serialized as STRINGS (never JSON numbers) to avoid float error. Every mutating call takes an
    Idempotency-Key. Every balance/transaction carries is_paper.

    v1.1.0 (ADR-0004, 2026-09-27) adds the exchange's quote leg: a PAPER-ONLY cash balance
    (currency USD — a quote currency, not a credit type; credit-types.md §6), a paper-cash grant,
    and atomic trade settlement (`/v1/credits/settle-trade`). Real-money cash is not built: every
    cash surface is `is_paper: true` only, and a real-money request is refused with
    REAL_MONEY_DISABLED until counsel clears custody (F22).

    v1.2.0 (2026-09-27, KW03 SPEC §8) adds order RESERVATIONS so a matched trade can never fail
    settlement for lack of funds. The engine reserves what an order could spend when it accepts it
    (`/v1/credits/reserve`), settlement consumes that reservation, and the engine releases what is
    left when the order closes (`/v1/credits/release`). A reservation raises the balance's
    `locked_amount`, and from v1.2 EVERY debit on every endpoint (consumption, conversion, burn,
    settlement) must leave `balance >= locked_amount` — reserved value cannot be spent elsewhere.
    Available = balance − locked_amount.

    v1.3.0 (2026-09-28, KW03 SPEC §7.3/§8) lets the engine find reservations left behind when an
    order's journal write failed after its reserve (an "orphan"):
      - `GET /v1/credits/reservations` lists OPEN reservations older than a minimum age (measured on
        the ledger's clock), keyset-paginated. matching-engine only.
      - `/v1/credits/release` takes an optional `reason` (`order_closed` | `orphaned`), recorded on the
        reservation's audit event, so an automated repair is distinguishable from a normal close.
      - Replaying `/v1/credits/reserve` for an order_id whose reservation is RELEASED is now
        `409 RESERVATION_CLOSED`, not a 200 carrying the released state: a released reservation locks
        nothing, so the order_id is spent. Minor version: the only consumer is matching-engine (not
        yet live), and it already refuses such a 200.
      - `Reservation` gains `created_at`.

servers:
  - url: https://api.1trade.io
    description: prod
  - url: http://localhost:8080
    description: local (k3d ingress)

tags:
  - name: customer
    description: Customer-facing, called via the gateway with a tenant JWT.
  - name: internal
    description: Service-to-service, called with a service token (inference-gateway, compute-control, platform-core, settlement-trust, matching-engine). Not exposed to customers.

paths:
  /v1/credits/balances:
    get:
      tags: [customer]
      summary: List the tenant's balances (one per credit type).
      operationId: listBalances
      parameters:
        - $ref: '#/components/parameters/IsPaperQuery'
      responses:
        '200':
          description: Balances.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items: { $ref: '#/components/schemas/Balance' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/credits/transactions:
    get:
      tags: [customer]
      summary: List the tenant's ledger transactions (newest first, paginated).
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/IsPaperQuery'
        - { name: credit_type, in: query, schema: { type: string }, description: filter by credit type }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to,   in: query, schema: { type: string, format: date-time } }
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: opaque pagination cursor }
      responses:
        '200':
          description: A page of transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/credits/purchase:
    post:
      tags: [internal]
      summary: Book a prepaid purchase (cash → credits). Called by platform-core after payment settles.
      operationId: purchase
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '200': { description: Booked., content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/credits/convert:
    post:
      tags: [customer]
      summary: Convert between credit types at the published rate (bidirectional, 1% spread — see credit-types.md §3).
      operationId: convert
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertRequest' }
      responses:
        '200':
          description: Converted; returns both transaction legs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  debit:  { $ref: '#/components/schemas/Transaction' }
                  credit: { $ref: '#/components/schemas/Transaction' }
        '402': { $ref: '#/components/responses/InsufficientCredit' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/credits/conversion-rates:
    get:
      tags: [customer]
      summary: Current conversion rates + spread.
      operationId: getConversionRates
      responses:
        '200':
          description: Rates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  spread: { type: string, description: "house spread as a decimal fraction, e.g. '0.01'" }
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string }
                        to:   { type: string }
                        rate: { type: string, description: "decimal string: 'to' units per 1 'from' unit, pre-spread" }

  /v1/credits/debit:
    post:
      tags: [internal]
      summary: Debit a credit on consumption. Called by inference-gateway and compute-control.
      operationId: debit
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebitRequest' }
      responses:
        '200': { description: Debited., content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '402': { $ref: '#/components/responses/InsufficientCredit' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/credits/mint:
    post:
      tags: [internal]
      summary: Mint GPU credits against attested capacity. Called by settlement-trust (backing-checked).
      operationId: mint
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MintBurnRequest' } } }
      responses:
        '200': { description: Minted., content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { description: Would exceed backing ratio., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/credits/burn:
    post:
      tags: [internal]
      summary: Burn GPU credits on redemption/expiry. Called by settlement-trust.
      operationId: burn
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MintBurnRequest' } } }
      responses:
        '200': { description: Burned., content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /v1/credits/cash/balances:
    get:
      tags: [customer]
      summary: List the tenant's paper cash balances (one per quote currency). Paper only (ADR-0004).
      operationId: listCashBalances
      responses:
        '200':
          description: Cash balances. Empty until the tenant's paper-cash grant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items: { $ref: '#/components/schemas/CashBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/credits/cash/transactions:
    get:
      tags: [customer]
      summary: List the tenant's paper cash transactions (newest first, paginated).
      operationId: listCashTransactions
      parameters:
        - { name: limit,  in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: opaque pagination cursor }
      responses:
        '200':
          description: A page of cash transactions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/CashTransaction' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/credits/paper-cash/grant:
    post:
      tags: [internal]
      summary: >
        Grant starting paper cash to a tenant (the "$10,000 paper" onboarding allocation). Called by
        platform-core during activation. Paper only. One grant per Idempotency-Key; platform-core
        uses `paper-grant:<tenant_id>` so a tenant is granted once however often activation retries.
      operationId: grantPaperCash
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PaperCashGrantRequest' } } }
      responses:
        '200': { description: "Granted (or the original grant, on replay).", content: { application/json: { schema: { $ref: '#/components/schemas/CashTransaction' } } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/Error' }

  /v1/credits/settle-trade:
    post:
      tags: [internal]
      summary: >
        Settle one matched trade atomically. Called by matching-engine only (service token), once per
        trade in trades.executed.v1 order. Paper only until counsel clears real-money custody.
      description: >
        In ONE database transaction:
          notional = floor_6dp(price × quantity)   (the engine's rule; the ledger recomputes it)
          buyer:  credit_type +quantity · cash −notional (op trade) · cash −buyer.fee (op fee)
          seller: credit_type −quantity · cash +notional (op trade) · cash −seller.fee (op fee)
        Zero-fee legs write no row. Every row extends its balance's hash chain and emits credit.tx.v1
        (credit legs, operation `trade`) or cash.tx.v1 (cash legs) after commit. Paper fees are
        debited and not credited anywhere: paper flow earns no revenue.

        Reservations (v1.2): each debit leg first consumes the paying order's open reservation —
        the buyer's cash legs (trade + fee) consume the reservation of buyer.order_id, the seller's
        credit leg consumes the reservation of seller.order_id. Consuming lowers the reservation's
        remaining amount, the balance and locked_amount by the same amount, so available is
        unchanged. A leg larger than the remaining reservation is 402. A leg with no reservation
        must fit within available (balance − locked_amount).

        All-or-nothing: if the seller lacks the credits (INSUFFICIENT_CREDIT) or the buyer lacks the
        cash (INSUFFICIENT_CASH), nothing is written and the trade is unsettled — the engine must
        bust it. The engine's pre-trade risk check is expected to make this rare; the ledger is the
        backstop, never the other way round.

        Idempotency: the Idempotency-Key header MUST equal `trade_id`. A replay returns the original
        result; the same trade_id with a different body is 409.

        Caller restriction (security): the body names BOTH tenants, so this endpoint moves one tenant's
        credits and cash to another. It MUST accept only the matching-engine's own service identity,
        not any internal service token; any other caller is 403. Otherwise a compromised internal
        service could settle a fabricated trade against a victim tenant.
      operationId: settleTrade
      security: [ { serviceToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SettleTradeRequest' } } }
      responses:
        '200': { description: "Settled (or the original settlement, on replay).", content: { application/json: { schema: { $ref: '#/components/schemas/SettleTradeResult' } } } }
        '402':
          description: Seller lacks the credits (INSUFFICIENT_CREDIT) or buyer lacks the cash (INSUFFICIENT_CASH). Nothing written.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: Caller is not the matching-engine service identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422':
          description: >
            Invalid trade: is_paper false (REAL_MONEY_DISABLED), same tenant on both sides, an internal
            account on a paper trade, a non-tradeable credit type, or Idempotency-Key ≠ trade_id.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/credits/reserve:
    post:
      tags: [internal]
      summary: >
        Reserve what an order could spend, at order acceptance. matching-engine only (its own
        settlement token). Paper only in v1.2.
      description: >
        One reservation per order_id: a buy reserves cash (notional at its limit, or the exact sweep
        cost for an immediate order, plus the taker fee); a sell reserves the credits it offers.
        The reserved amount must fit within AVAILABLE (balance − locked_amount); it then raises
        locked_amount by that much. Idempotency-Key MUST equal order_id. A replay of an OPEN
        reservation returns it unchanged; the same order_id with a different body is 409
        IDEMPOTENCY_CONFLICT; from v1.3 a replay of a RELEASED reservation is 409 RESERVATION_CLOSED.
      operationId: reserve
      security: [ { serviceToken: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReserveRequest' } } }
      responses:
        '200': { description: "Reserved (or the original, still-open reservation, on replay).", content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '402':
          description: Not enough available balance (INSUFFICIENT_CREDIT for credits, INSUFFICIENT_CASH for cash). Nothing reserved.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '403':
          description: Caller is not the matching-engine service identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '409':
          description: >
            IDEMPOTENCY_CONFLICT (order_id reserved with a different body), or RESERVATION_CLOSED
            (v1.3: this order_id's reservation was already released; the id is spent). Nothing is
            reserved either way.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: Invalid request (REAL_MONEY_DISABLED, bad asset, non-positive amount, key ≠ order_id).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/credits/release:
    post:
      tags: [internal]
      summary: >
        Release whatever an order's reservation still holds, when the order closes (filled,
        cancelled, expired, rejected). matching-engine only. Idempotent: releasing a released
        reservation returns it unchanged.
      operationId: release
      security: [ { serviceToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [order_closed, orphaned]
                  description: >
                    v1.3, optional; recorded on the release audit event. `order_closed`: the order
                    reached a terminal state. `orphaned`: the engine's journal has no order for this
                    reservation. Absent means unspecified.
      responses:
        '200': { description: Released (or already released)., content: { application/json: { schema: { $ref: '#/components/schemas/Reservation' } } } }
        '403':
          description: Caller is not the matching-engine service identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '404':
          description: No reservation for this order_id.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: Invalid request (order_id not a uuid, unknown reason).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/credits/reservations:
    get:
      tags: [internal]
      summary: List open reservations for reconciliation (v1.3). matching-engine only (its settlement token).
      description: >
        The engine's reconciler pages through OPEN reservations at least min_age_seconds old (measured
        on the ledger's clock, so the caller's clock never matters) and releases any whose order its
        journal does not know. Ordered by order_id; pass `next_cursor` back as `after`; a null
        `next_cursor` is the last page. Paper only, like every reservation in v1.x.
      operationId: listReservations
      security: [ { serviceToken: [] } ]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, enum: [open] } }
        - { name: min_age_seconds, in: query, schema: { type: integer, minimum: 0, maximum: 604800, default: 0 } }
        - { name: after, in: query, schema: { type: string, format: uuid }, description: "exclusive order_id cursor" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: One page of open reservations., content: { application/json: { schema: { $ref: '#/components/schemas/ReservationPage' } } } }
        '403':
          description: Caller is not the matching-engine service identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422':
          description: Invalid query (state missing or not open, min_age_seconds or limit out of range, after not a uuid).
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/credits/audit/chain-verify:
    get:
      tags: [internal]
      summary: Verify the hash chain is intact for a tenant (or globally). Zero mismatches expected.
      operationId: chainVerify
      parameters:
        - { name: tenant_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  checked: { type: integer }
                  first_bad_tx_id: { type: string, nullable: true }

components:
  securitySchemes:
    tenantJwt:   { type: http, scheme: bearer, bearerFormat: JWT, description: "Customer tenant JWT from platform-core." }
    serviceToken: { type: http, scheme: bearer, description: "Service-to-service token (internal endpoints)." }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: Required on every mutating call. Repeats with the same key return the original result; no double-apply.
    IsPaperQuery:
      name: is_paper
      in: query
      schema: { type: boolean, default: true }
      description: Which ledger to read. Paper and real are never mixed.

  schemas:
    Decimal:
      type: string
      description: Fixed-point decimal as a string (NUMERIC(20,6)). Never a JSON number.
      pattern: '^-?\\d{1,14}(\\.\\d{1,6})?$'
      example: "100.000000"
    CreditType:
      type: string
      description: One of the codes in docs/contracts/credit-types.md.
      enum: [ai_index, text, speech, image, video, embeddings, gpu_h100, gpu_h200]
    Balance:
      type: object
      required: [credit_type, balance, locked_amount, is_paper]
      properties:
        credit_type:   { $ref: '#/components/schemas/CreditType' }
        balance:       { $ref: '#/components/schemas/Decimal' }
        locked_amount: { $ref: '#/components/schemas/Decimal', description: "held by open order reservations (v1.2); available = balance − locked_amount" }
        is_paper:      { type: boolean }
        sub_account_id: { type: string, format: uuid, nullable: true }
    Transaction:
      type: object
      required: [tx_id, credit_type, operation, amount, balance_after, is_paper, created_at, chain_hash]
      properties:
        tx_id:          { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        credit_type:    { $ref: '#/components/schemas/CreditType' }
        operation:      { type: string, enum: [purchase, consumption, conversion, mint, burn, refund, trade] }
        amount:         { $ref: '#/components/schemas/Decimal', description: "signed delta applied to the balance" }
        reference_id:   { type: string, nullable: true, description: "e.g. stripe event id, usage event id" }
        balance_after:  { $ref: '#/components/schemas/Decimal' }
        is_paper:       { type: boolean }
        created_at:     { type: string, format: date-time }
        chain_hash:     { type: string }
    PurchaseRequest:
      type: object
      required: [tenant_id, credit_type, amount, is_paper, currency]
      properties:
        tenant_id:    { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        credit_type:  { $ref: '#/components/schemas/CreditType' }
        amount:       { $ref: '#/components/schemas/Decimal' }
        currency:     { type: string, enum: [USD, JPY], description: "source currency (recorded in metadata)" }
        reference_id: { type: string, description: "payment reference (Stripe event id / wire ref)" }
        is_paper:     { type: boolean }
    ConvertRequest:
      type: object
      required: [from, to, amount, is_paper]
      properties:
        from:     { $ref: '#/components/schemas/CreditType' }
        to:       { $ref: '#/components/schemas/CreditType' }
        amount:   { $ref: '#/components/schemas/Decimal', description: "amount of `from` to convert" }
        is_paper: { type: boolean }
    DebitRequest:
      type: object
      required: [tenant_id, credit_type, amount, is_paper, usage_event_id]
      properties:
        tenant_id:     { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        credit_type:   { $ref: '#/components/schemas/CreditType' }
        amount:        { $ref: '#/components/schemas/Decimal' }
        usage_event_id: { type: string, description: "id of the usage event driving this debit (idempotency anchor)" }
        is_paper:      { type: boolean }
    MintBurnRequest:
      type: object
      required: [tenant_id, credit_type, amount, is_paper, reference_id]
      properties:
        tenant_id:    { type: string, format: uuid }
        credit_type:  { $ref: '#/components/schemas/CreditType', description: "a gpu_* tier" }
        amount:       { $ref: '#/components/schemas/Decimal' }
        reference_id: { type: string, description: "capacity/attestation reference" }
        is_paper:     { type: boolean }
    Currency:
      type: string
      description: Quote currency. Not a credit type (credit-types.md §6). USD only in v1.1.
      enum: [USD]
    CashBalance:
      type: object
      required: [currency, balance, locked_amount, is_paper]
      properties:
        currency:      { $ref: '#/components/schemas/Currency' }
        balance:       { $ref: '#/components/schemas/Decimal' }
        locked_amount: { $ref: '#/components/schemas/Decimal', description: "reserved for resting buy orders" }
        is_paper:      { type: boolean, enum: [true], description: "paper only until counsel clears custody (ADR-0004)" }
    CashTransaction:
      type: object
      required: [tx_id, tenant_id, currency, operation, amount, balance_after, is_paper, created_at, chain_hash]
      properties:
        tx_id:          { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        currency:       { $ref: '#/components/schemas/Currency' }
        operation:      { type: string, enum: [paper_grant, trade, fee] }
        amount:         { $ref: '#/components/schemas/Decimal', description: "signed delta applied to the balance" }
        reference_id:   { type: string, nullable: true, description: "trade_id for trade/fee; the grant key for paper_grant" }
        balance_after:  { $ref: '#/components/schemas/Decimal' }
        is_paper:       { type: boolean, enum: [true] }
        created_at:     { type: string, format: date-time }
        chain_hash:     { type: string }
    PaperCashGrantRequest:
      type: object
      required: [tenant_id, currency, amount, is_paper]
      properties:
        tenant_id: { type: string, format: uuid }
        currency:  { $ref: '#/components/schemas/Currency' }
        amount:    { $ref: '#/components/schemas/Decimal', description: "positive; the onboarding default is 10000.000000" }
        is_paper:  { type: boolean, enum: [true] }
    SettleParty:
      type: object
      required: [tenant_id, order_id, fee, is_internal]
      properties:
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        order_id:       { type: string, format: uuid }
        fee:            { $ref: '#/components/schemas/Decimal', description: "non-negative, in the trade's currency" }
        is_internal:    { type: boolean }
    SettleTradeRequest:
      type: object
      description: The settlement subset of a trades.executed.v1 payload, plus the quote currency.
      required: [trade_id, product_id, credit_type, price, quantity, currency, buyer, seller, is_paper, chain_hash]
      properties:
        trade_id:    { type: string, format: uuid }
        product_id:  { type: string }
        credit_type: { $ref: '#/components/schemas/CreditType' }
        price:       { $ref: '#/components/schemas/Decimal' }
        quantity:    { $ref: '#/components/schemas/Decimal' }
        currency:    { $ref: '#/components/schemas/Currency' }
        buyer:       { $ref: '#/components/schemas/SettleParty' }
        seller:      { $ref: '#/components/schemas/SettleParty' }
        is_paper:    { type: boolean, description: "must be true in v1.1; false is 422 REAL_MONEY_DISABLED" }
        chain_hash:  { type: string, description: "the trade's engine chain hash, stored as the settlement reference" }
    SettleTradeResult:
      type: object
      required: [trade_id, notional, credit_transactions, cash_transactions]
      properties:
        trade_id:            { type: string, format: uuid }
        notional:            { $ref: '#/components/schemas/Decimal' }
        credit_transactions: { type: array, items: { $ref: '#/components/schemas/Transaction' }, description: "buyer +qty, seller −qty" }
        cash_transactions:   { type: array, items: { $ref: '#/components/schemas/CashTransaction' }, description: "trade and non-zero fee legs" }
    ReserveRequest:
      type: object
      required: [order_id, tenant_id, asset_kind, asset, amount, is_paper]
      properties:
        order_id:       { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        asset_kind:     { type: string, enum: [credit, cash], description: "credit for a sell, cash for a buy" }
        asset:          { type: string, description: "a CreditType when asset_kind=credit; a Currency when asset_kind=cash" }
        amount:         { $ref: '#/components/schemas/Decimal', description: "positive" }
        is_paper:       { type: boolean, description: "must be true in v1.2; false is 422 REAL_MONEY_DISABLED" }
    Reservation:
      type: object
      required: [order_id, tenant_id, asset_kind, asset, amount, remaining, state, is_paper, created_at]
      properties:
        order_id:       { type: string, format: uuid }
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        asset_kind:     { type: string, enum: [credit, cash] }
        asset:          { type: string }
        amount:         { $ref: '#/components/schemas/Decimal', description: "originally reserved" }
        remaining:      { $ref: '#/components/schemas/Decimal', description: "still locked; 0 once released or fully consumed" }
        state:          { type: string, enum: [open, released] }
        is_paper:       { type: boolean }
        created_at:     { type: string, format: date-time, description: "v1.3; when the reservation was made (ledger clock)" }
    ReservationPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:        { type: array, items: { $ref: '#/components/schemas/Reservation' } }
        next_cursor: { type: string, format: uuid, nullable: true, description: "pass as `after`; null on the last page" }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: INSUFFICIENT_CREDIT, description: "v1.1 adds INSUFFICIENT_CASH and REAL_MONEY_DISABLED" }
        message: { type: string }
        details: { type: object, additionalProperties: true }

  responses:
    Unauthorized:
      description: Missing/invalid auth.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error:
      description: Validation error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    InsufficientCredit:
      description: Balance would go negative.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError', example: { code: INSUFFICIENT_CREDIT, message: "balance too low" } } } }
    IdempotencyConflict:
      description: Idempotency-Key reused with a different payload.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError', example: { code: IDEMPOTENCY_CONFLICT, message: "key reused with different body" } } } }

security:
  - tenantJwt: []
