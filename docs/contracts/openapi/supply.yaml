openapi: 3.0.3
info:
  title: 1Trade Supply API (partner datacenter capacity)
  version: 1.2.0
  description: >
    **Partner datacenters bring GPUs into the one 1Trade pool (F16 / F17).** Owned by
    `compute-platform` (served by `compute-control`). A partner registers a supply source (GPU tier,
    count, region, SLA tier); it stays `pending` until activated (by 1Trade operations today; by GPU
    attestation, F19, next). An `active` source whose agent heartbeats is scheduled exactly like
    1Trade's own capacity: placement never special-cases owned versus partner, and every job and
    instance records the source that served it (`supply_source_id` on `compute.usage.v1`), which
    drives partner payouts (F18).

    **Drain.** Suspending a source, retiring it, or missing heartbeats stops NEW work landing on it;
    work already running keeps its GPUs until it ends. Healthy capacity is `min(gpu_count,
    gpus_healthy)` from the latest heartbeat.

    Auth: a first-party tenant JWT with the `admin` or `engineer` role manages that tenant's own
    sources (another tenant's source reads as 404). The internal service token is for operations
    (list all, activate). Mutations take an Idempotency-Key.

    **v1.1.0 (F18) — partner payouts.** Operations sets each partner's agreement (rate per GPU-hour per
    tier, 1Trade fee, holdback, dispute window) and closes payout cycles. A cycle turns the per-source
    usage records into one statement per partner, and each usage record is counted in exactly one
    statement, so payouts reconcile to usage by construction:
    `gross = Σ gpu_hours × rate`, `fee = gross × fee_percent`, `payout = gross − fee`,
    `holdback = payout × holdback_percent`, `released = payout − holdback` (fixed-point, truncated to 6
    places). States: `pending` → `wired` (operations records the transfer reference; moving real money is
    outside this API) → `settled` once the holdback is released after the dispute window. A partner may
    `dispute` a statement inside its window; disputes wait in the operations review queue, which
    `resolve`s them by releasing or withholding the holdback.

    **Paper and real never mix.** Usage carries `is_paper`; a cycle produces separate statements for
    paper and real usage. A paper statement is a simulation — it shows what the partner would earn —
    and can never be wired (409 PAPER_STATEMENT).

    **v1.2.0 (F19) — attestation gates activation.** A source activates only when all five layers
    pass: `kyb` and `bond` (recorded by operations), `hardware` (a signed GPU identity report bound to
    a fresh 1Trade nonce, checked against a trusted key: GPU count and model must match the
    registration), `challenge` (a nonce-seeded challenge answered correctly before its deadline —
    presence and responsiveness), and `telemetry` (a fresh heartbeat with no uncorrectable ECC
    errors). When the last layer passes, a pending source activates by itself. A later `fail` or
    `drift` on any layer suspends an active source. We attest genuineness, presence and delivery —
    not the correctness of arbitrary computation. `activate` by operations, and `resume` of a
    suspended source, return 409 ATTESTATION_INCOMPLETE until every layer passes. At most 10
    challenges may be open per source (429). The hardware verifier is a stand-in signing root until
    NVIDIA attestation (NRAS) is wired; with no trusted root configured the layer cannot pass.

servers:
  - { url: "https://api.1trade.io", description: prod }
  - { url: "http://localhost:8086", description: "local (compute-control)" }

tags:
  - { name: supply, description: "Partner capacity: register, heartbeat, suspend / resume, retire, usage." }
  - { name: operations, description: "Internal: activation and the fleet-wide view." }

paths:
  /v1/supply/sources:
    post:
      tags: [supply]
      summary: Register a supply source. It starts `pending`.
      operationId: registerSource
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterSource' } } }
      responses:
        '201': { description: Registered (or the original, on replay)., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Idempotency-Key reused with a different body., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      tags: [supply]
      summary: >
        The caller's sources, with live GPUs in use. With the service token: every source,
        including 1Trade's own.
      operationId: listSources
      responses:
        '200': { description: Sources., content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Source' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/supply/sources/{id}:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    get:
      tags: [supply]
      summary: One source.
      operationId: getSource
      responses:
        '200': { description: The source., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [supply]
      summary: Retire a source (terminal). It drains, then leaves the pool.
      operationId: retireSource
      responses:
        '200': { description: Retired., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/supply/sources/{id}/heartbeat:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [supply]
      summary: >
        The partner agent's heartbeat (every 30 s). A source with no heartbeat for 2 minutes takes no
        new work until one arrives.
      operationId: heartbeat
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Heartbeat' } } }
      responses:
        '200': { description: Recorded., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The source is retired., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/supply/sources/{id}/suspend:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [supply]
      summary: Stop taking new work (drain). Idempotent.
      operationId: suspendSource
      responses:
        '200': { description: Suspended., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not active or suspended (pending or retired)., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/sources/{id}/resume:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [supply]
      summary: Take work again after a suspension. Idempotent.
      operationId: resumeSource
      responses:
        '200': { description: Active., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not suspended or active (pending or retired)., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/sources/{id}/activate:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [operations]
      summary: "pending → active. Service token only (operations today; attestation, F19, next)."
      operationId: activateSource
      responses:
        '200': { description: Active., content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not pending., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/sources/{id}/usage:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    get:
      tags: [supply]
      summary: >
        GPU time served on this source, per tier, from the same metering that produces
        compute.usage.v1 (the basis for payouts, F18).
      operationId: sourceUsage
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "inclusive; default: 30 days ago" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "exclusive; default: now" }
      responses:
        '200': { description: Usage., content: { application/json: { schema: { $ref: '#/components/schemas/SourceUsage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/supply/sources/{id}/attestation:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    get:
      tags: [supply]
      summary: "v1.2: each layer's latest result, and which layers still block activation."
      operationId: getAttestation
      responses:
        '200': { description: Attestation status., content: { application/json: { schema: { $ref: '#/components/schemas/AttestationStatus' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/supply/sources/{id}/attestation/{layer}:
    parameters:
      - { $ref: '#/components/parameters/SourceId' }
      - { name: layer, in: path, required: true, schema: { type: string, enum: [kyb, bond] } }
    post:
      tags: [operations]
      summary: "v1.2: operations record a manual layer (KYB review, bond staked). Service token only."
      operationId: recordManualLayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, evidence]
              properties:
                state:    { type: string, enum: [pass, fail] }
                evidence: { type: object, description: "document references, bond amount and custody reference", additionalProperties: true }
      responses:
        '200': { description: Recorded., content: { application/json: { schema: { $ref: '#/components/schemas/AttestationStatus' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/supply/sources/{id}/challenges:
    parameters: [ { $ref: '#/components/parameters/SourceId' } ]
    post:
      tags: [supply]
      summary: "v1.2: issue a nonce for the agent: `hardware` (to bind into the signed GPU report) or `challenge` (to answer)."
      operationId: issueChallenge
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [hardware, challenge] } } } } }
      responses:
        '201': { description: Issued., content: { application/json: { schema: { $ref: '#/components/schemas/Challenge' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: Too many open challenges., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/sources/{id}/challenges/{challenge_id}:
    parameters:
      - { $ref: '#/components/parameters/SourceId' }
      - { name: challenge_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [supply]
      summary: >
        v1.2: answer a challenge. For `hardware`, `report` (base64 JSON: source_id, nonce, gpus[{uuid, model}])
        and `signature` (base64). For `challenge`, `result` (hex). One answer per challenge; late or
        replayed answers fail.
      operationId: answerChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report:    { type: string }
                signature: { type: string }
                result:    { type: string }
      responses:
        '200': { description: The layer's result was recorded (pass or fail)., content: { application/json: { schema: { $ref: '#/components/schemas/AttestationStatus' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already answered or expired., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/partners/{tenant_id}/agreement:
    parameters: [ { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } } ]
    put:
      tags: [operations]
      summary: Set a partner's payout agreement (v1.1). Service token only. Applies to cycles closed afterwards.
      operationId: setAgreement
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Agreement' } } } }
      responses:
        '200': { description: Stored., content: { application/json: { schema: { $ref: '#/components/schemas/Agreement' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      tags: [supply]
      summary: A partner's agreement (the partner itself, or operations).
      operationId: getAgreement
      responses:
        '200': { description: The agreement., content: { application/json: { schema: { $ref: '#/components/schemas/Agreement' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/supply/payouts/cycles:
    post:
      tags: [operations]
      summary: >
        Close a payout cycle (v1.1). Service token only. For every partner with an agreement and
        unpaid usage created in [period_start, period_end), one statement. Idempotent: usage already
        in a statement is never counted again, and closing the same period twice adds nothing.
      operationId: closeCycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_start, period_end]
              properties:
                period_start: { type: string, format: date-time }
                period_end:   { type: string, format: date-time, description: "must be in the past" }
      responses:
        '200': { description: Statements created by this call (empty on a repeat)., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Payout' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }

  /v1/supply/payouts:
    get:
      tags: [supply]
      summary: The partner's payout statements, newest first. With the service token, all of them; `state=disputed` is the review queue.
      operationId: listPayouts
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, wired, disputed, settled] } }
      responses:
        '200': { description: Statements., content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Payout' } } } } } } }

  /v1/supply/payouts/{payout_id}:
    parameters: [ { $ref: '#/components/parameters/PayoutId' } ]
    get:
      tags: [supply]
      summary: One statement with its per-tier lines.
      operationId: getPayout
      responses:
        '200': { description: The statement., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/supply/payouts/{payout_id}/wire:
    parameters: [ { $ref: '#/components/parameters/PayoutId' } ]
    post:
      tags: [operations]
      summary: "pending → wired: operations records the transfer of the released amount. Service token only."
      operationId: markWired
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string, minLength: 1, maxLength: 128 } } } } } }
      responses:
        '200': { description: Wired., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '409': { description: "Not pending, or a paper statement (PAPER_STATEMENT: simulations never move money).", content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/payouts/{payout_id}/dispute:
    parameters: [ { $ref: '#/components/parameters/PayoutId' } ]
    post:
      tags: [supply]
      summary: The partner disputes a statement inside its dispute window. The holdback is frozen until operations resolves it.
      operationId: disputePayout
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses:
        '200': { description: Disputed., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '409': { description: Outside the dispute window, or not pending / wired., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/payouts/{payout_id}/release-holdback:
    parameters: [ { $ref: '#/components/parameters/PayoutId' } ]
    post:
      tags: [operations]
      summary: "wired → settled once the dispute window has passed with no dispute. Service token only."
      operationId: releaseHoldback
      responses:
        '200': { description: Settled., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '409': { description: Not wired, disputed, or still inside the dispute window., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/supply/payouts/{payout_id}/resolve:
    parameters: [ { $ref: '#/components/parameters/PayoutId' } ]
    post:
      tags: [operations]
      summary: Resolve a dispute (the review queue). `release` pays the holdback; `withhold` keeps it. Either way the statement settles.
      operationId: resolveDispute
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [outcome, note], properties: { outcome: { type: string, enum: [release, withhold] }, note: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses:
        '200': { description: Resolved., content: { application/json: { schema: { $ref: '#/components/schemas/Payout' } } } }
        '409': { description: Not disputed., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

components:
  securitySchemes:
    tenantJwt: { type: http, scheme: bearer, bearerFormat: JWT }
    serviceToken: { type: http, scheme: bearer }
  parameters:
    SourceId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    PayoutId: { name: payout_id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 } }
  responses:
    Unauthorized: { description: Missing or invalid credential., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: "Needs the admin or engineer role (or, for operations, the service token).", content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: No such source for this caller., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Invalid: { description: Invalid request., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    RegisterSource:
      type: object
      required: [name, gpu_type, gpu_count, region, sla_tier]
      additionalProperties: false
      properties:
        name:      { type: string, minLength: 1, maxLength: 80 }
        gpu_type:  { type: string, enum: [gpu_h100, gpu_h200], description: "the GPU credit tier it supplies (credit-types.md §1)" }
        gpu_count: { type: integer, minimum: 1, maximum: 4096 }
        region:    { type: string, minLength: 1, maxLength: 64, example: us-east-1a }
        sla_tier:  { type: string, enum: [bronze, silver, gold] }
    Heartbeat:
      type: object
      required: [gpus_healthy]
      properties:
        gpus_healthy:    { type: integer, minimum: 0, description: "GPUs the agent reports fit to schedule" }
        utilization_pct: { type: integer, minimum: 0, maximum: 100 }
        ecc_errors:      { type: integer, minimum: 0, description: "uncorrectable ECC errors since the last heartbeat" }
    Source:
      type: object
      required: [id, name, gpu_type, gpu_count, region, sla_tier, state, schedulable, gpus_in_use, created_at]
      properties:
        id:                { type: string, format: uuid }
        partner_tenant_id: { type: string, format: uuid, nullable: true, description: "null for 1Trade-owned capacity" }
        name:              { type: string }
        gpu_type:          { type: string, enum: [gpu_h100, gpu_h200] }
        gpu_count:         { type: integer }
        region:            { type: string }
        sla_tier:          { type: string, enum: [bronze, silver, gold] }
        state:             { type: string, enum: [pending, active, suspended, retired] }
        schedulable:       { type: boolean, description: "taking new work right now: active, heartbeat fresh, healthy GPUs > 0" }
        gpus_healthy:      { type: integer, nullable: true, description: "from the latest heartbeat" }
        gpus_in_use:       { type: integer, description: "reserved by running jobs and instances" }
        utilization_pct:   { type: integer, nullable: true }
        last_heartbeat_at: { type: string, format: date-time, nullable: true }
        created_at:        { type: string, format: date-time }
    SourceUsage:
      type: object
      required: [source_id, from, to, by_tier]
      properties:
        source_id: { type: string, format: uuid }
        from:      { type: string, format: date-time }
        to:        { type: string, format: date-time }
        by_tier:
          type: array
          items:
            type: object
            required: [gpu_type, gpu_seconds, units, sessions]
            properties:
              gpu_type:    { type: string }
              gpu_seconds: { type: string, description: "fixed-point decimal, as on compute.usage.v1" }
              units:       { type: string, description: "gpu credits billed to customers for this time, fixed-point" }
              sessions:    { type: integer, description: "usage events (metering intervals) counted" }
    AttestationStatus:
      type: object
      required: [source_id, complete, layers, missing]
      properties:
        source_id: { type: string, format: uuid }
        complete:  { type: boolean, description: "every layer's latest result is pass" }
        missing:   { type: array, items: { type: string }, description: "layers not yet passing" }
        layers:
          type: object
          additionalProperties:
            type: object
            properties:
              state:       { type: string, enum: [pass, fail, drift] }
              attested_at: { type: string, format: date-time }
              detail:      { type: string }
    Challenge:
      type: object
      required: [id, kind, nonce, expires_at]
      properties:
        id:         { type: string, format: uuid }
        kind:       { type: string, enum: [hardware, challenge] }
        nonce:      { type: string, description: "hex" }
        iterations: { type: integer, description: "challenge: apply SHA-256 this many times to the nonce bytes; answer the final digest in hex" }
        expires_at: { type: string, format: date-time }
    Agreement:
      type: object
      required: [rates, fee_percent, holdback_percent, dispute_days]
      properties:
        partner_tenant_id: { type: string, format: uuid, readOnly: true }
        rates:
          type: object
          description: "USD per GPU-hour, per tier, fixed-point strings, e.g. {gpu_h100: \"1.800000\"}"
          additionalProperties: { type: string }
        fee_percent:      { type: string, description: "1Trade's fee, fixed-point percent 0-100" }
        holdback_percent: { type: string, description: "held until the dispute window passes, 0-100" }
        dispute_days:     { type: integer, minimum: 1, maximum: 90 }
    Payout:
      type: object
      required: [id, partner_tenant_id, period_start, period_end, currency, is_paper, gpu_hours, gross, fee, payout, holdback, released, state, dispute_until, lines]
      properties:
        id:                { type: string, format: uuid }
        partner_tenant_id: { type: string, format: uuid }
        period_start:      { type: string, format: date-time }
        period_end:        { type: string, format: date-time }
        currency:          { type: string, enum: [USD] }
        is_paper:          { type: boolean, description: "a simulation from paper usage; never wired" }
        gpu_hours:         { type: string }
        gross:             { type: string }
        fee:               { type: string }
        payout:            { type: string, description: "gross − fee" }
        holdback:          { type: string }
        released:          { type: string, description: "payout − holdback: what the wire carries" }
        usage_records:     { type: integer }
        state:             { type: string, enum: [pending, wired, disputed, settled] }
        wire_reference:    { type: string, nullable: true }
        dispute_until:     { type: string, format: date-time }
        dispute_reason:    { type: string, nullable: true }
        resolution:        { type: string, nullable: true, enum: [release, withhold, null] }
        lines:
          type: array
          items:
            type: object
            properties:
              gpu_type:    { type: string }
              gpu_hours:   { type: string }
              rate:        { type: string }
              gross:       { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

security:
  - tenantJwt: []
  - serviceToken: []
