openapi: 3.0.3
info:
  title: Exascale Compute API (GPU types, quota, scheduled jobs, instances)
  version: 1.1.0
  description: >
    **The Exascale compute control-plane API.** Owned by `compute-platform` (the `compute-control`
    service). It wraps the Kubernetes scheduling stack (Kueue queues per workload class + Volcano gang
    scheduling + the NVIDIA GPU Operator) behind a stable API.

    **v1.1.0 (M3, F13).** Adds the customer-facing **on-demand GPU instance lifecycle**:
    create / list / get / stop / start / delete instances, each drawn from the same GPU pool the
    internal scheduler (M2) places jobs on. Instances boot a versioned **Exascale ML Stack image** and
    return connection info (ssh / jupyter / http). Target: <90s P95 time-to-running. Per-second GPU
    usage meters to `events/compute.usage.v1` while an instance runs; stop releases its GPUs back to
    the pool and ends billing. The M2 internal scheduling + quota surface and the GPU-type catalog are
    unchanged and back-compatible. Clusters (multi-node / InfiniBand) land in M5.

    Auth: a first-party tenant **JWT** for customer reads (quota, types, instances); the internal
    **service token** for scheduling (`POST /v1/compute/jobs`, called by the gateway/runtime).
    `is_paper` is derived from the authenticated principal, never the request body. Metered GPU usage
    is emitted as `events/compute.usage.v1` → credit-ledger debits the `gpu_*` credit (idempotent on
    `usage_id`). See docs/plans/features/F12-compute-control-plane.md and credit-types.md §1 (GPU tiers).

servers:
  - { url: "https://api.exascale.io", description: prod }
  - { url: "http://localhost:8086", description: "local (compute-control)" }

tags:
  - { name: catalog, description: "GPU types + availability (read-only)." }
  - { name: quota, description: "Per-tenant / per-sub-account GPU quota." }
  - { name: scheduling, description: "Internal: place workloads via Kueue + Volcano." }
  - { name: instances, description: "Customer on-demand GPU instances (create / stop / start / delete)." }

paths:
  /healthz:
    get: { tags: [catalog], summary: Liveness., operationId: healthz, responses: { '200': { description: ok } } }
  /readyz:
    get: { tags: [catalog], summary: Readiness (K8s API reachable)., operationId: readyz, responses: { '200': { description: ready }, '503': { description: not ready } } }

  /v1/compute/types:
    get:
      tags: [catalog]
      summary: List GPU types + per-hour price + current availability.
      operationId: listComputeTypes
      responses:
        '200':
          description: GPU types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  types: { type: array, items: { $ref: '#/components/schemas/ComputeType' } }

  /v1/compute/quota:
    get:
      tags: [quota]
      summary: The authenticated tenant's GPU quota + usage (per tier).
      operationId: getQuota
      responses:
        '200':
          description: Quotas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotas: { type: array, items: { $ref: '#/components/schemas/Quota' } }
        '401': { $ref: '#/components/responses/Error' }

  /v1/compute/jobs:
    get:
      tags: [scheduling]
      summary: List the tenant's scheduled jobs (newest first).
      operationId: listJobs
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/Job' } }
    post:
      tags: [scheduling]
      summary: >
        Submit a workload to the scheduler (internal — service token). Creates a Kueue Workload in the
        class's queue; multi-pod jobs gang-schedule via Volcano. Idempotent on the Idempotency-Key.
      operationId: submitJob
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JobRequest' } } }
      responses:
        '202': { description: Accepted + queued., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '402': { $ref: '#/components/responses/Error' }   # quota exhausted
        '409': { $ref: '#/components/responses/Error' }   # idempotency conflict
        '422': { $ref: '#/components/responses/Error' }

  /v1/compute/jobs/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [scheduling]
      summary: Get a job (status + placement).
      operationId: getJob
      responses:
        '200': { description: Job., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [scheduling]
      summary: Cancel / tear down a job.
      operationId: cancelJob
      responses:
        '200': { description: Cancelled. }
        '404': { $ref: '#/components/responses/Error' }

  /v1/compute/instances:
    get:
      tags: [instances]
      summary: List the tenant's GPU instances (newest first), optionally filtered by state.
      operationId: listInstances
      parameters:
        - { name: state, in: query, required: false, schema: { $ref: '#/components/schemas/InstanceState' } }
      responses:
        '200':
          description: Instances.
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances: { type: array, items: { $ref: '#/components/schemas/Instance' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [instances]
      summary: >
        Create an on-demand GPU instance (tenant JWT). Reserves GPUs from the pool, boots the chosen
        ML-Stack image, and returns connection info once running (<90s P95). `is_paper` comes from the
        principal. Idempotent on the Idempotency-Key — a retry returns the same instance.
      operationId: createInstance
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InstanceRequest' } } }
      responses:
        '201': { description: Created (provisioning)., content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }   # insufficient GPU capacity
        '422': { $ref: '#/components/responses/Error' }

  /v1/compute/instances/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [instances]
      summary: Get one instance (state + connection info).
      operationId: getInstance
      responses:
        '200': { description: Instance., content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [instances]
      summary: Terminate an instance and free its GPUs (irreversible).
      operationId: deleteInstance
      responses:
        '200': { description: Terminated., content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /v1/compute/instances/{id}/stop:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [instances]
      summary: Stop a running instance — releases its GPUs back to the pool and ends billing.
      operationId: stopInstance
      responses:
        '200': { description: Stopped (or stopping)., content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }   # not in a stoppable state

  /v1/compute/instances/{id}/start:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [instances]
      summary: Start a stopped instance — re-reserves GPUs (capacity permitting) and resumes billing.
      operationId: startInstance
      responses:
        '200': { description: Starting (or running)., content: { application/json: { schema: { $ref: '#/components/schemas/Instance' } } } }
        '402': { $ref: '#/components/responses/Error' }   # no capacity to restart
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }   # not in a startable state

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: Dedupe key — a retried submit returns the same job, never a second placement.

  responses:
    Error:
      description: Error.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  schemas:
    Decimal:
      type: string
      description: Fixed-point decimal as a string (NUMERIC(20,6)) — never a float.
      example: "2.990000"

    ComputeType:
      type: object
      properties:
        id:             { type: string, enum: [gpu_h100, gpu_h200], description: "GPU tier == credit_type" }
        name:           { type: string, example: "H100 80GB" }
        gpu:            { type: string, example: "NVIDIA H100 80GB" }
        credit_type:    { type: string, enum: [gpu_h100, gpu_h200] }
        price_per_hour: { $ref: '#/components/schemas/Decimal' }
        available:      { type: integer, description: "schedulable GPUs of this tier right now (mock-GPU count locally)" }

    Quota:
      type: object
      properties:
        credit_type:    { type: string, enum: [gpu_h100, gpu_h200] }
        limit_hours:    { $ref: '#/components/schemas/Decimal' }
        used_hours:     { $ref: '#/components/schemas/Decimal' }
        reserved_hours: { $ref: '#/components/schemas/Decimal' }
        remaining_hours: { $ref: '#/components/schemas/Decimal' }
        is_paper:       { type: boolean }

    JobRequest:
      type: object
      required: [workload_class, gpu_type, gpus]
      properties:
        workload_class: { type: string, enum: [inference, training-small, training-large], description: "selects the Kueue queue" }
        gpu_type:       { type: string, enum: [gpu_h100, gpu_h200] }
        gpus:           { type: integer, minimum: 1, description: "GPUs per pod" }
        pods:           { type: integer, minimum: 1, default: 1, description: ">1 → Volcano gang (all-or-nothing) scheduling" }
        reserved:       { type: boolean, default: false, description: "use the tenant's reserved capacity (pre-empts on-demand)" }
        sub_account_id: { type: [string, "null"], format: uuid }
        reference_id:   { type: string, description: "caller's correlation id (e.g. the inference model/instance)" }

    Job:
      type: object
      properties:
        id:              { type: string, example: "cjob_01Hf…" }
        status:          { type: string, enum: [pending, queued, scheduled, running, succeeded, failed, cancelled] }
        workload_class:  { type: string }
        gpu_type:        { type: string, enum: [gpu_h100, gpu_h200] }
        gpus:            { type: integer }
        pods:            { type: integer }
        reserved:        { type: boolean }
        supply_source_id: { type: string, description: "owned DC or partner that provided the GPUs (drives payout)" }
        placement:       { type: [string, "null"], description: "node/zone once scheduled" }
        is_paper:        { type: boolean }
        created_at:      { type: string, format: date-time }

    InstanceState:
      type: string
      description: >
        Instance lifecycle. provisioning → running; running → stopping → stopped; stopped → starting →
        running; any → terminated (irreversible).
      enum: [provisioning, running, stopping, stopped, starting, terminated]

    ConnectInfo:
      type: object
      description: "How to reach a running instance. Null fields until the instance is running."
      properties:
        ssh:     { type: [string, "null"], example: "ssh ubuntu@i-7c2a.gpu.exascale.io" }
        jupyter: { type: [string, "null"], format: uri, example: "https://i-7c2a.gpu.exascale.io/jupyter" }
        http:    { type: [string, "null"], format: uri, example: "https://i-7c2a.gpu.exascale.io" }

    InstanceRequest:
      type: object
      required: [type]
      properties:
        type:           { type: string, enum: [gpu_h100, gpu_h200], description: "GPU tier (== credit_type debited)" }
        count:          { type: integer, minimum: 1, maximum: 32, default: 1, description: "GPUs in this instance (self-serve up to 32)" }
        image:          { type: string, default: "stable", description: "ML-Stack image: 'stable' | 'latest' | a pinned version id (e.g. 'exascale-ml-stack-2026.05')" }
        region:         { type: string, default: "us-east-1" }
        idle_stop_minutes: { type: [integer, "null"], minimum: 0, description: "auto-stop after this many idle minutes (null = no auto-stop; default per F06 policy)" }
        sub_account_id: { type: [string, "null"], format: uuid }

    Instance:
      type: object
      description: "Customer on-demand GPU instance."
      properties:
        id:               { type: string, example: "i-7c2a" }
        gpu_type:         { type: string, enum: [gpu_h100, gpu_h200] }
        count:            { type: integer, description: "GPUs in this instance" }
        state:            { $ref: '#/components/schemas/InstanceState' }
        image:            { type: string, description: "resolved image version id" }
        region:           { type: string }
        connect:          { $ref: '#/components/schemas/ConnectInfo' }
        supply_source_id: { type: string, description: "owned DC or partner that provided the GPUs (drives payout)" }
        idle_stop_minutes: { type: [integer, "null"] }
        is_paper:         { type: boolean }
        created_at:       { type: string, format: date-time }
        started_at:       { type: [string, "null"], format: date-time, description: "when it last entered running" }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:    { type: string, example: quota_exhausted }
        message: { type: string }
