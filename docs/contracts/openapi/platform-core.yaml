openapi: 3.0.3
info:
  title: 1Trade Platform-Core API (auth, accounts, RBAC, keys, billing)
  version: 1.9.0
  description: >
    Identity for the whole platform. Owned by `platform-core`. Every other service authenticates
    inbound requests by verifying the JWT this service issues (see JwtClaims) — that's how each
    service resolves tenant_id / sub_account_id / roles / is_paper. SAML/SCIM/2FA are M4 additions
    (this v1 covers email+password, OAuth, API keys, and the account/org surface). See
    docs/plans/features/F02-auth-and-sso.md and F03-accounts-orgs-rbac.md.

    **v1.6.0 (2026-09-28, team management).** Members (list; admins remove — never themselves, never
    the last admin), invitations (admins invite an email with roles and optionally a sub-account; the
    emailed token is single use, 7 days, and accepting it creates a verified user in the inviting
    tenant and signs them in; one account per email), and sub-accounts (teams with their own ledger
    balances: members placed in one carry `sub_account_id` in their JWT and are billed to it; admin
    or billing funds or drains it from the main balance through credit.yaml v1.4 transfer). Every
    change is audited. `/v1/auth/me` returns `sub_account_id`.

    **v1.7.0 (2026-09-28, two-factor authentication).** TOTP (RFC 6238: SHA-1, 6 digits, 30 s, ±1
    step). `setup` issues a secret (sealed with AES-256-GCM at rest) that only takes effect once a
    code from it is confirmed at `enable`, which returns ten single-use recovery codes once (stored
    as sha256). With 2FA on, `/v1/auth/login` answers `{mfa_required: true, mfa_token}` instead of a
    session: a 5-minute challenge with no tenant_id, so no service accepts it as a session; redeem
    it at `/v1/auth/login/2fa`. Every code works once (the time step is claimed atomically). Five
    wrong codes lock the second step for 15 minutes (429 `mfa_locked`). Turning 2FA off needs a
    current code or a recovery code. `/v1/auth/me` and members return `mfa_enabled`.

    **v1.8.0 (2026-09-28, SAML single sign-on).** One IdP per tenant (admins save its metadata XML,
    which must carry a signing certificate and an HTTP-Redirect SSO URL), 1–10 email domains that
    route to it (each domain to one tenant only), a non-admin role for just-in-time members, and an
    optional enforcement (password sign-in refused with 403 `sso_required` for non-admins; admins
    keep it as the break-glass path). Flow: `sso/start {email}` returns the IdP URL with an
    AuthnRequest whose id we record; the web app's ACS relays the IdP's form post to `sso/acs`,
    which accepts only a signed assertion answering that request (single use, 10 minutes), for our
    ACS and audience, currently valid, naming an email in the tenant's domains. Accounts are never
    merged across tenants (403 `sso_account_conflict`); with JIT off, unknown emails get 403
    `sso_no_account`. Artifact binding and encrypted assertions are not supported (no outbound
    calls; no SP key). The IdP enforces its own MFA.

    **v1.9.0 (2026-09-28, payment methods — US dollars only).** Checkout takes `method`: `card`
    (settles at checkout) or `ach` (a US bank-account debit through Stripe, which settles days later).
    `currency` must be `usd` (JPY removed). Credits are booked only once money has settled:
    `checkout.session.completed` with `payment_status=paid`, or `checkout.session.async_payment_succeeded`;
    a completed ACH checkout waits as `processing`; `async_payment_failed` marks it `failed` and it is
    never revived. Every booking is keyed on the purchase (`purchase:<id>`), so the webhook, its
    retries and the dev auto-settle can never double-mint. Wires: `POST /v1/billing/wires` (admin or
    billing; KYC for real money; $1,000 minimum) returns 1Trade's USD bank details, the exact amount
    and a unique reference; treasury records the receipt with the service token, and it must match
    the invoice to the cent (409 `amount_mismatch` otherwise, reconciled by hand).

servers:
  - { url: "https://api.1trade.io", description: prod }
  - { url: "http://localhost:8080", description: "local (k3d ingress)" }

tags:
  - { name: team, description: "v1.6: members, invitations, sub-accounts." }
  - { name: auth, description: "Login, OAuth, session, API keys." }
  - { name: accounts, description: "Tenants, orgs, users, roles." }
  - { name: billing, description: "Credit purchase — Stripe checkout, webhook, purchase history." }

paths:
  /v1/auth/signup:
    post:
      tags: [auth]
      summary: Self-serve signup — creates an individual tenant + admin user, returns a JWT (auto-login).
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                tenant_name: { type: string }
      responses:
        '201':
          description: Created + authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '409': { description: Email already registered., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Email + password login. Returns a JWT (see JwtClaims).
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: "JWT bearer token" }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: Start the OAuth browser flow (google | github | microsoft). Redirects to the IdP.
      operationId: oauthStart
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github, microsoft] } }
        - { name: redirect_uri, in: query, schema: { type: string } }
      responses:
        '302': { description: Redirect to the identity provider. }

  /v1/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth callback. Exchanges the code, then redirects back with a session set.
      operationId: oauthCallback
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Authenticated; redirect to the app. }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session.
      operationId: logout
      security: [{ tenantJwt: [] }]
      responses:
        '204': { description: Logged out. }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: The current identity (decoded from the bearer token).
      operationId: me
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: Current identity.
          content: { application/json: { schema: { $ref: '#/components/schemas/Identity' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/keys:
    get:
      tags: [auth]
      summary: List the tenant's API keys (metadata only; never the secret).
      operationId: listKeys
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema: { type: object, properties: { keys: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } } }
    post:
      tags: [auth]
      summary: Create a scoped API key. The secret is returned ONCE.
      operationId: createKey
      security: [{ tenantJwt: [] }]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string }, description: "e.g. inference:read, compute:write" }
      responses:
        '201':
          description: Created; `secret` shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties: { secret: { type: string, description: "shown once — store it now" } }

  /v1/auth/keys/{id}:
    delete:
      tags: [auth]
      summary: Revoke an API key.
      operationId: revokeKey
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Revoked. }

  /v1/auth/keys/introspect:
    post:
      tags: [auth]
      summary: >
        Internal — resolve a raw API key to its tenant/scopes/is_paper. Called service-to-service
        (e.g. the inference gateway) to authenticate a customer's `exk_...` key. Not for end users.
      operationId: introspectKey
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string, description: "the raw key, e.g. exk_..." }
      responses:
        '200':
          description: Resolved principal.
          content: { application/json: { schema: { $ref: '#/components/schemas/KeyPrincipal' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown or revoked key.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/account/tenants/{id}:
    get:
      tags: [accounts]
      summary: Tenant details.
      operationId: getTenant
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Tenant., content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/account/orgs/{id}/users:
    get:
      tags: [accounts]
      summary: List users in an org (with roles).
      operationId: listOrgUsers
      security: [{ tenantJwt: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: '#/components/schemas/User' } }
                  next_cursor: { type: string, nullable: true }

  /v1/auth/verify:
    post:
      tags: [auth]
      summary: Verify an email address with the one-time token (the token is the credential; no bearer).
      operationId: verifyEmail
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        '200': { description: Verified., content: { application/json: { schema: { type: object, properties: { verified: { type: boolean } } } } } }
        '400': { description: Invalid or used token., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/auth/verify/resend:
    post:
      tags: [auth]
      summary: >-
        Resend an email-verification link. Authenticated → for the caller (dev returns the token).
        Unauthenticated with {email} → for that address if it exists and is unverified; the response is
        a constant {sent:true} that never reveals whether the email is registered (used by the login
        screen's "resend verification" when sign-in is blocked by the verification gate).
      operationId: resendVerify
      security: [{ tenantJwt: [] }, {}]   # authed (caller) OR anonymous (by email)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, description: "anonymous mode — resend for this address" }
      responses:
        '200': { description: Sent — constant response (no account enumeration). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/billing/budget:
    get:
      tags: [billing]
      summary: The tenant's monthly credit budget (null if none set).
      operationId: getBudget
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Budget. }
    put:
      tags: [billing]
      summary: Set the tenant's monthly budget (billing/admin). Drives 50/80/100% alerts. Audited.
      operationId: setBudget
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credit_type, monthly_limit], properties: { credit_type: { type: string }, monthly_limit: { type: string, description: "fixed-point decimal string" } } } } }
      responses:
        '200': { description: Updated. }
        '403': { description: Insufficient role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/auth/2fa:
    get:
      tags: [auth]
      summary: "v1.7: two-factor status."
      operationId: mfaStatus
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Status., content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, recovery_codes_left: { type: integer } } } } } }
  /v1/auth/2fa/setup:
    post:
      tags: [auth]
      summary: "v1.7: a fresh authenticator secret (pending until enabled). 409 mfa_enabled when already on."
      operationId: mfaSetup
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Secret., content: { application/json: { schema: { type: object, properties: { secret: { type: string, description: "base32" }, otpauth_uri: { type: string } } } } } }
        '409': { description: mfa_enabled., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/auth/2fa/enable:
    post:
      tags: [auth]
      summary: "v1.7: confirm a code from the pending secret; returns ten recovery codes, once."
      operationId: mfaEnable
      security: [{ tenantJwt: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses:
        '200': { description: On., content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, recovery_codes: { type: array, items: { type: string } } } } } } }
        '409': { description: no_setup., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: bad_code., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/auth/2fa/disable:
    post:
      tags: [auth]
      summary: "v1.7: turn 2FA off with a current code or a recovery code."
      operationId: mfaDisable
      security: [{ tenantJwt: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string }, recovery_code: { type: string } } } } } }
      responses:
        '204': { description: Off. }
        '409': { description: mfa_off., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: bad_code., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: mfa_locked., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/auth/login/2fa:
    post:
      tags: [auth]
      summary: "v1.7: redeem the login challenge with a code or a recovery code (no bearer: the challenge is the credential)."
      operationId: loginSecondFactor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mfa_token], properties: { mfa_token: { type: string }, code: { type: string }, recovery_code: { type: string } } } } } }
      responses:
        '200': { description: Session., content: { application/json: { schema: { type: object, properties: { token: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        '401': { description: invalid_challenge | bad_code., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: mfa_locked., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/sso:
    get:
      tags: [auth]
      summary: "v1.8: the tenant's SAML configuration and our service-provider values (admin)."
      operationId: getSSO
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Configuration., content: { application/json: { schema: { $ref: '#/components/schemas/SSOConfig' } } } }
        '403': { description: Not an admin., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      tags: [auth]
      summary: "v1.8: save the IdP metadata, email domains and policy (admin)."
      operationId: putSSO
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idp_metadata_xml, email_domains]
              additionalProperties: false
              properties:
                idp_metadata_xml: { type: string }
                email_domains:    { type: array, minItems: 1, maxItems: 10, items: { type: string } }
                default_role:     { type: string, enum: [billing, engineer, viewer, trader], default: viewer }
                jit:              { type: boolean, default: true }
                enforce:          { type: boolean, default: false }
      responses:
        '200': { description: Saved., content: { application/json: { schema: { $ref: '#/components/schemas/SSOConfig' } } } }
        '409': { description: domain_taken., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: bad_metadata | bad_domains | bad_role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      tags: [auth]
      summary: "v1.8: turn single sign-on off (admin)."
      operationId: deleteSSO
      security: [{ tenantJwt: [] }]
      responses:
        '204': { description: Off. }
  /v1/auth/sso/metadata/{tenant_id}:
    get:
      tags: [auth]
      summary: "v1.8: our service-provider metadata for the tenant (public, for the IdP admin)."
      operationId: ssoMetadata
      parameters: [ { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: SAML metadata., content: { application/samlmetadata+xml: { schema: { type: string } } } }
        '404': { description: Not configured., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/auth/sso/start:
    post:
      tags: [auth]
      summary: "v1.8: where to send the browser for this work email (public)."
      operationId: ssoStart
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        '200': { description: IdP redirect., content: { application/json: { schema: { type: object, properties: { redirect_url: { type: string } } } } } }
        '404': { description: sso_not_configured., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/auth/sso/acs:
    post:
      tags: [auth]
      summary: "v1.8: redeem the IdP's SAMLResponse (relayed by the web app's ACS) for a session (public: the signed assertion is the credential)."
      operationId: ssoACS
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [saml_response, relay_state], properties: { saml_response: { type: string, description: "base64, as posted by the IdP" }, relay_state: { type: string } } } } } }
      responses:
        '200': { description: Session., content: { application/json: { schema: { type: object, properties: { token: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        '401': { description: sso_request | sso_invalid | sso_domain | sso_not_configured., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: sso_account_conflict | sso_no_account., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/members:
    get:
      tags: [team]
      summary: "v1.6: the tenant's members (any member)."
      operationId: listMembers
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Members., content: { application/json: { schema: { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/Member' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/account/members/{id}:
    delete:
      tags: [team]
      summary: "v1.6: remove a member (admin). 409 `self` for yourself, 409 `last_admin` for the last admin."
      operationId: removeMember
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Removed. }
        '403': { description: Not an admin., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No such member., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: self | last_admin., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/members/{id}/sub-account:
    put:
      tags: [team]
      summary: "v1.6: place a member in a sub-account (admin); null = the main balance. Takes effect at their next sign-in."
      operationId: setMemberSubAccount
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [sub_account_id], properties: { sub_account_id: { type: string, format: uuid, nullable: true } } } } }
      responses:
        '200': { description: Set. }
        '404': { description: No such member or sub-account in this tenant., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/invites:
    get:
      tags: [team]
      summary: "v1.6: pending invitations (admin)."
      operationId: listInvites
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Invitations., content: { application/json: { schema: { type: object, properties: { invites: { type: array, items: { $ref: '#/components/schemas/Invite' } } } } } } }
    post:
      tags: [team]
      summary: "v1.6: invite an email (admin). Roles default to viewer. The link is emailed; in dev without mail it is returned as dev_token."
      operationId: createInvite
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email:          { type: string, format: email }
                roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
                sub_account_id: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Invited., content: { application/json: { schema: { $ref: '#/components/schemas/Invite' } } } }
        '404': { description: No such sub-account in this tenant., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: invite_pending | email_taken., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Bad email or role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/invites/{id}:
    delete:
      tags: [team]
      summary: "v1.6: revoke a pending invitation (admin)."
      operationId: revokeInvite
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Revoked. }
        '404': { description: No such pending invitation., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/invites/lookup:
    get:
      tags: [team]
      summary: "v1.6: what an invitation is for (no bearer: the token is the credential). 404 when invalid, used, revoked or expired."
      operationId: lookupInvite
      parameters: [ { name: token, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:       { type: string }
                  tenant_name: { type: string }
                  roles:       { type: array, items: { $ref: '#/components/schemas/Role' } }
                  expires_at:  { type: string, format: date-time }
        '404': { description: invite_invalid., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/invites/accept:
    post:
      tags: [team]
      summary: "v1.6: accept an invitation (no bearer: the token is the credential); creates the user and signs them in. Single use."
      operationId: acceptInvite
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, format: password, minLength: 8, maxLength: 72 } } } } }
      responses:
        '201': { description: Created + authenticated., content: { application/json: { schema: { type: object, properties: { token: { type: string }, expires_at: { type: string, format: date-time } } } } } }
        '404': { description: invite_invalid., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: email_taken., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: weak_password., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/sub-accounts:
    get:
      tags: [team]
      summary: "v1.6: the tenant's sub-accounts with member counts."
      operationId: listSubAccounts
      security: [{ tenantJwt: [] }]
      responses:
        '200': { description: Sub-accounts., content: { application/json: { schema: { type: object, properties: { sub_accounts: { type: array, items: { $ref: '#/components/schemas/SubAccount' } } } } } } }
    post:
      tags: [team]
      summary: "v1.6: create a sub-account (admin). Names are unique per tenant."
      operationId: createSubAccount
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 } } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/SubAccount' } } } }
        '409': { description: name_taken., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/sub-accounts/{id}/transfer:
    post:
      tags: [team]
      summary: "v1.6: fund a sub-account from the main balance, or return credits to it (admin or billing). Idempotent on the key."
      operationId: transferSubAccount
      security: [{ tenantJwt: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credit_type, amount, direction]
              additionalProperties: false
              properties:
                credit_type: { type: string, description: "see credit-types.md" }
                amount:      { type: string, description: "positive fixed-point, at most 6 decimals" }
                direction:   { type: string, enum: [fund, return] }
      responses:
        '200': { description: Moved. }
        '402': { description: insufficient_credit in the balance moved from., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Needs admin or billing., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No such sub-account in this tenant., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: The ledger did not complete it; retry with the same key., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/orgs:
    post:
      tags: [accounts]
      summary: Create an org under the tenant (admin-only). Audited.
      operationId: createOrg
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } }
      responses:
        '201': { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/Org' } } } }
        '403': { description: Insufficient role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      tags: [accounts]
      summary: List the tenant's orgs.
      operationId: listOrgs
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: Orgs.
          content: { application/json: { schema: { type: object, properties: { orgs: { type: array, items: { $ref: '#/components/schemas/Org' } } } } } }

  /v1/account/users/{id}/roles:
    put:
      tags: [accounts]
      summary: Assign a user's roles within the tenant (admin-only). Audited (before/after).
      operationId: assignRoles
      security: [{ tenantJwt: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, items: { $ref: '#/components/schemas/Role' } } } } } }
      responses:
        '200': { description: Updated. }
        '403': { description: Insufficient role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Unknown role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/audit:
    get:
      tags: [accounts]
      summary: The tenant's audit log, newest first (admin-only). Every sensitive action is recorded.
      operationId: listAudit
      security: [{ tenantJwt: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: string, format: uuid }
                        actor_id:    { type: string, format: uuid, nullable: true }
                        action:      { type: string }
                        target_type: { type: string, nullable: true }
                        target_id:   { type: string, nullable: true }
                        before:      { type: object, additionalProperties: true, nullable: true }
                        after:       { type: object, additionalProperties: true, nullable: true }
                        is_paper:    { type: boolean }
                        created_at:  { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Insufficient role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/kyc:
    get:
      tags: [accounts]
      summary: The caller's tenant KYC status (gates real-money purchases).
      operationId: getKyc
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: KYC status.
          content: { application/json: { schema: { $ref: '#/components/schemas/Kyc' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [accounts]
      summary: >
        Submit identity verification (KYC/AML) for the caller's tenant. Captures minimal PII (legal
        name · ISO-3166 country · entity type). In prod the submission lands `pending` for review; in
        dev/sandbox it is auto-verified. Allowed only from unverified/rejected.
      operationId: submitKyc
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, country, entity_type]
              properties:
                legal_name:  { type: string }
                country:     { type: string, description: "ISO 3166-1 alpha-2" }
                entity_type: { type: string, enum: [individual, business] }
      responses:
        '200':
          description: The resulting KYC state (verified in dev, else pending).
          content: { application/json: { schema: { $ref: '#/components/schemas/Kyc' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: "Already pending or verified (code kyc_not_submittable).", content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Invalid submission., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/account/kyc/{tenant_id}/decision:
    post:
      tags: [accounts]
      summary: >
        Apply a compliance decision (verified|rejected) to a pending tenant submission. INTERNAL —
        authorized by the service-to-service token, never an end-user bearer (a tenant cannot verify
        itself). The prod manual-review / IDV-vendor callback path.
      operationId: reviewKyc
      security: [{ serviceToken: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [verified, rejected] }
      responses:
        '200':
          description: Decision applied.
          content: { application/json: { schema: { type: object, properties: { tenant_id: { type: string, format: uuid }, status: { $ref: '#/components/schemas/KycStatus' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: "No pending submission for this tenant.", content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/conversations:
    get:
      summary: List the caller's chat conversations (metadata only) for the playground history sidebar.
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: Conversations, newest activity first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items: { $ref: '#/components/schemas/ConversationMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create a new conversation (transcript optional) and return it with its server id.
      security: [{ tenantJwt: [] }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationBody' } } }
      responses:
        '201':
          description: Created.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/conversations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Load one conversation (full transcript), scoped to the caller's tenant.
      security: [{ tenantJwt: [] }]
      responses:
        '200':
          description: The conversation.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      summary: Replace a conversation's transcript (and optional title/model). Tenant-scoped.
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConversationBody' } } }
      responses:
        '200':
          description: Updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Delete a conversation (tenant-scoped).
      security: [{ tenantJwt: [] }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/billing/checkout:
    post:
      tags: [billing]
      summary: >
        Start a credit purchase. Validates the order, records a pending purchase, and returns a
        Stripe Checkout URL. Credits are only minted after payment settles (the webhook books them).
      operationId: createCheckout
      security: [{ tenantJwt: [] }]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, credit_type, currency]
              properties:
                amount:      { type: string, description: "credits to buy, fixed-point decimal string" }
                credit_type: { type: string, description: "e.g. text, ai_index, gpu_h100 (see credit-types.md)" }
                currency:    { type: string, enum: [usd], default: usd, description: "v1.9: US dollars only" }
                method:      { type: string, enum: [card, ach], default: card, description: "v1.9: card, or ACH bank debit (settles in days); for wires use /v1/billing/wires" }
      responses:
        '200':
          description: Checkout created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_id:  { type: string, format: uuid }
                  checkout_url: { type: string, description: "redirect the customer here to pay (real Stripe)" }
                  settled:      { type: boolean, description: "dev/sandbox only — true when MockStripe booked the credits inline (no redirect / webhook); real Stripe returns false" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            Real-money purchase blocked — the tenant is not KYC-verified (code `kyc_required`).
            Sandbox (is_paper) purchases never hit this. Submit identity verification at POST
            /v1/account/kyc, then retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
        '422': { description: Invalid order., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/billing/webhook/stripe:
    post:
      tags: [billing]
      summary: >
        Stripe webhook receiver. NOT bearer-authenticated — authenticity is the Stripe-Signature
        header (HMAC). On checkout.session.completed it books the credits to the ledger, idempotent
        on the Stripe event id (replays are safe).
      operationId: stripeWebhook
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "raw Stripe Event payload (verified by signature)" }
      responses:
        '200': { description: Received (and booked if applicable). }
        '400': { description: Bad/again-replayable payload., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Signature verification failed., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/billing/wires:
    post:
      tags: [billing]
      summary: "v1.9: invoice a purchase payable by USD wire (admin or billing; KYC for real money; minimum $1,000)."
      operationId: createWire
      security: [{ tenantJwt: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount, credit_type], properties: { amount: { type: string }, credit_type: { type: string } } } } }
      responses:
        '201':
          description: Wire invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_id:  { type: string, format: uuid }
                  status:       { type: string, enum: [pending] }
                  amount_usd:   { type: string }
                  credits:      { type: string }
                  credit_type:  { type: string }
                  reference:    { type: string, description: "put this on the wire so it can be matched" }
                  instructions:
                    type: object
                    properties:
                      bank_name:      { type: string }
                      bank_address:   { type: string }
                      account_name:   { type: string }
                      account_number: { type: string }
                      routing_number: { type: string, description: "ABA" }
                      swift:          { type: string }
        '403': { description: kyc_required or role., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: below_wire_minimum | unpriced | bad_request., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: wire_unavailable (no bank details configured)., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /v1/billing/wires/{id}/received:
    post:
      tags: [billing]
      summary: "v1.9: treasury records an incoming wire (service token). Must equal the invoice to the cent; books the credits once."
      operationId: wireReceived
      security: [{ serviceToken: [] }]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [amount_usd, bank_reference], properties: { amount_usd: { type: string, description: "dollars, at most 2 decimals" }, bank_reference: { type: string } } } } }
      responses:
        '200': { description: Paid and booked (a replay of the same receipt re-books idempotently). }
        '401': { description: Not the service token. }
        '404': { description: No such wire purchase., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: amount_mismatch | not_pending., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: booking_failed — recorded; send the same receipt again., content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /v1/billing/purchases:
    get:
      tags: [billing]
      summary: The tenant's purchase history.
      operationId: listPurchases
      security: [{ tenantJwt: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Purchases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases: { type: array, items: { $ref: '#/components/schemas/Purchase' } }

components:
  securitySchemes:
    tenantJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        The platform JWT. Every service verifies it (signature + exp) and reads JwtClaims to
        authorize by tenant_id / sub_account_id / roles, and to enforce is_paper isolation.
    apiKey:
      type: http
      scheme: bearer
      description: "A scoped API key (for programmatic clients, e.g. the inference API)."
    serviceToken:
      type: http
      scheme: bearer
      description: "Service-to-service token for internal endpoints (e.g. the inference gateway introspecting an API key)."

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
      description: Required on mutating calls; repeats with the same key return the original result.

  schemas:
    ConversationMeta:
      type: object
      description: Conversation list item (no transcript body) for the history sidebar.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string, description: "Catalog id of the conversation's current model." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Conversation:
      type: object
      description: A full stored conversation. transcript is the opaque JSON of the playground turns.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        model: { type: string }
        transcript: { type: array, items: { type: object, additionalProperties: true } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationBody:
      type: object
      description: Create/update payload. All fields optional on create; transcript replaces on update.
      properties:
        title: { type: string }
        model: { type: string }
        transcript: { type: array, items: { type: object, additionalProperties: true } }
    Role:
      type: string
      enum: [admin, billing, engineer, viewer, trader]   # trader is Phase 2 (unused in Phase 1)
    JwtClaims:
      type: object
      description: The claims every service reads from the verified bearer token.
      required: [sub, tenant_id, roles, is_paper, iat, exp]
      properties:
        sub:            { type: string, format: uuid, description: "user id" }
        tenant_id:      { type: string, format: uuid }
        org_id:         { type: string, format: uuid, nullable: true }
        sub_account_id: { type: string, format: uuid, nullable: true }
        roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
        is_paper:       { type: boolean, description: "paper vs real; services MUST honor this end-to-end" }
        iat:            { type: integer, description: "issued-at (unix seconds)" }
        exp:            { type: integer, description: "expiry (unix seconds)" }
    Identity:
      type: object
      properties:
        user_id:   { type: string, format: uuid }
        email:     { type: string, format: email }
        tenant_id: { type: string, format: uuid }
        org_id:    { type: string, format: uuid, nullable: true }
        roles:     { type: array, items: { $ref: '#/components/schemas/Role' } }
        is_paper:  { type: boolean }
        kyc_status: { $ref: '#/components/schemas/KycStatus', description: "tenant KYC state; gates real-money purchases (the web app reads this for the buy gate)" }
    KycStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
      description: >
        Tenant identity-verification state (F22). Only `verified` permits a real-money (is_paper=false)
        purchase. Transitions: unverified → pending → verified | rejected (rejected may resubmit).
    Kyc:
      type: object
      properties:
        status:       { $ref: '#/components/schemas/KycStatus' }
        can_purchase: { type: boolean, description: "true ⇔ status=verified — may buy with real money now" }
        can_submit:   { type: boolean, description: "true when a (re)submission is allowed (unverified|rejected)" }
        legal_name:   { type: string }
        country:      { type: string, description: "ISO 3166-1 alpha-2" }
        entity_type:  { type: string, enum: [individual, business] }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at:  { type: string, format: date-time, nullable: true }
    Tenant:
      type: object
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        kind:      { type: string, enum: [individual, org] }
        is_paper:  { type: boolean }
        created_at: { type: string, format: date-time }
    Org:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string, format: date-time }
    User:
      type: object
      properties:
        id:    { type: string, format: uuid }
        email: { type: string, format: email }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
    ApiKey:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        scopes:     { type: array, items: { type: string } }
        prefix:     { type: string, description: "first chars, for identification" }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    KeyPrincipal:
      type: object
      description: The identity an API key resolves to (returned by introspect).
      required: [tenant_id, scopes, is_paper]
      properties:
        tenant_id:      { type: string, format: uuid }
        sub_account_id: { type: string, format: uuid, nullable: true }
        scopes:         { type: array, items: { type: string } }
        is_paper:       { type: boolean, description: "from the key's tenant; the gateway propagates it into usage events" }
    Purchase:
      type: object
      description: A credit purchase order and its settlement state.
      properties:
        id:          { type: string, format: uuid }
        amount:      { type: string, description: "credits purchased, fixed-point decimal string" }
        credit_type: { type: string }
        currency:    { type: string, enum: [usd], description: "v1.9: US dollars only (older rows may show jpy)" }
        status:      { type: string, enum: [pending, processing, paid, failed], description: "processing: an ACH debit is settling" }
        method:      { type: string, enum: [card, ach, wire] }
        amount_usd:  { type: string, description: "dollars charged, 2 decimals (when priced)" }
        wire_reference: { type: string, description: "wire purchases: the reference to put on the wire" }
        failure_reason: { type: string }
        created_at:  { type: string, format: date-time }
        paid_at:     { type: string, format: date-time, nullable: true }
    Member:
      type: object
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string }
        roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
        sub_account_id: { type: string, format: uuid, nullable: true }
        email_verified: { type: boolean }
        created_at:     { type: string, format: date-time }
    Invite:
      type: object
      properties:
        id:             { type: string, format: uuid }
        email:          { type: string }
        roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
        sub_account_id: { type: string, format: uuid, nullable: true }
        invited_by:     { type: string, format: uuid }
        created_at:     { type: string, format: date-time }
        expires_at:     { type: string, format: date-time }
        dev_token:      { type: string, description: "dev only, when no mail transport is configured" }
    SubAccount:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        members:    { type: integer }
        created_at: { type: string, format: date-time }
    SSOConfig:
      type: object
      properties:
        configured:      { type: boolean }
        idp_entity_id:   { type: string }
        email_domains:   { type: array, items: { type: string } }
        default_role:    { type: string }
        jit:             { type: boolean }
        enforce:         { type: boolean }
        updated_at:      { type: string, format: date-time }
        sp_entity_id:    { type: string, description: "audience the IdP must use" }
        acs_url:         { type: string }
        sp_metadata_url: { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:    { type: string }
        message: { type: string }

  responses:
    Unauthorized:
      description: Missing/invalid credentials.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

security:
  - tenantJwt: []
